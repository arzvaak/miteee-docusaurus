<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#1f2937;stroke-width:2;rx:8}
      .wire{stroke:#1f2937;stroke-width:2;fill:none}
      .arrow{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .mark{stroke:#d9480f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#111827}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#374151}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111827}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="24" y="34" class="title">Standard CAN data frame bit fields</text>

  <rect x="40" y="130" width="70" height="70" class="box"/><text x="62" y="170" class="txt">SOF</text>
  <rect x="110" y="130" width="145" height="70" class="box"/><text x="145" y="160" class="txt">11-bit</text><text x="142" y="184" class="txt">ID</text>
  <rect x="255" y="130" width="105" height="70" class="box"/><text x="282" y="170" class="txt">Ctrl</text>
  <rect x="360" y="130" width="180" height="70" class="box"/><text x="405" y="170" class="txt">Data</text>
  <rect x="540" y="130" width="110" height="70" class="box"/><text x="575" y="170" class="txt">CRC</text>
  <rect x="650" y="130" width="90" height="70" class="box"/><text x="678" y="170" class="txt">ACK</text>
  <rect x="740" y="130" width="95" height="70" class="box"/><text x="772" y="170" class="txt">EOF</text>
  <text x="120" y="95" class="small">Lower identifier wins arbitration because dominant 0 overrides recessive 1.</text>

</svg>
