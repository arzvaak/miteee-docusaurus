<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#1f2937;stroke-width:2;rx:8}
      .wire{stroke:#1f2937;stroke-width:2;fill:none}
      .arrow{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .mark{stroke:#d9480f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#111827}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#374151}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111827}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="24" y="34" class="title">Direct shunt multirange ammeter</text>

  <circle cx="115" cy="180" r="38" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="94" y="186" class="txt">Meter</text>
  <path class="wire" d="M40 180 L77 180 M153 180 L810 180"/>
  <path class="wire" d="M190 180 L190 250 L320 250 L320 180"/>
  <path class="wire" d="M380 180 L380 250 L510 250 L510 180"/>
  <path class="wire" d="M570 180 L570 250 L700 250 L700 180"/>
  <rect x="220" y="232" width="70" height="34" class="box"/><text x="225" y="255" class="txt">Rsh1</text>
  <rect x="410" y="232" width="70" height="34" class="box"/><text x="415" y="255" class="txt">Rsh2</text>
  <rect x="600" y="232" width="70" height="34" class="box"/><text x="605" y="255" class="txt">Rsh3</text>
  <path class="arrow" d="M40 150 L800 150"/><text x="405" y="136" class="txt">input current range selected by switch</text>
  <text x="210" y="302" class="small">Rsh = Im Rm / (I - Im)</text>

</svg>
