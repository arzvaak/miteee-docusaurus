<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#1f2937;stroke-width:2;rx:8}
      .wire{stroke:#1f2937;stroke-width:2;fill:none}
      .arrow{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .mark{stroke:#d9480f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#111827}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#374151}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111827}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="24" y="34" class="title">AC bridge for unknown inductance</text>

  <path class="wire" d="M160 80 L700 80 L700 280 L160 280 Z"/>
  <rect x="270" y="62" width="84" height="34" class="box"/><text x="282" y="85" class="txt">R1</text>
  <rect x="508" y="62" width="84" height="34" class="box"/><text x="520" y="85" class="txt">R2,C2</text>
  <rect x="270" y="262" width="84" height="34" class="box"/><text x="282" y="285" class="txt">Rx,Lx</text>
  <rect x="508" y="262" width="84" height="34" class="box"/><text x="520" y="285" class="txt">R4,C1</text>
  <path class="wire" d="M160 80 L430 180 L700 80 M160 280 L430 180 L700 280"/>
  <circle cx="430" cy="180" r="30" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="419" y="186" class="txt">D</text>
  <path class="mark" d="M360 252 L310 225"/><text x="120" y="222" class="small">unknown coil arm</text>
  <text x="230" y="330" class="small">Real balance gives Rx; imaginary balance gives Lx. Adjustable C1 and R4 set range.</text>

</svg>
