<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#1f2937;stroke-width:2;rx:8}
      .wire{stroke:#1f2937;stroke-width:2;fill:none}
      .arrow{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .mark{stroke:#d9480f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#111827}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#374151}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111827}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="24" y="34" class="title">Schering bridge for specimen capacitance</text>

  <path class="wire" d="M170 80 L710 80 L710 280 L170 280 Z"/>
  <rect x="278" y="62" width="90" height="34" class="box"/><text x="291" y="85" class="txt">C1,r1</text>
  <rect x="518" y="62" width="90" height="34" class="box"/><text x="532" y="85" class="txt">C2</text>
  <rect x="278" y="262" width="90" height="34" class="box"/><text x="287" y="285" class="txt">R3 || C3</text>
  <rect x="518" y="262" width="90" height="34" class="box"/><text x="527" y="285" class="txt">R4 || C4</text>
  <path class="wire" d="M170 80 L440 180 L710 80 M170 280 L440 180 L710 280"/>
  <circle cx="440" cy="180" r="28" fill="#f8fafc" stroke="#1f2937" stroke-width="2"/><text x="430" y="186" class="txt">G</text>
  <path class="mark" d="M320 110 L320 145"/><text x="105" y="145" class="small">specimen inserted here</text>
  <text x="245" y="330" class="small">Balance equation separates capacitance and dielectric loss.</text>

</svg>
