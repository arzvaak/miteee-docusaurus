<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#1f2937;stroke-width:2;rx:8}
      .wire{stroke:#1f2937;stroke-width:2;fill:none}
      .arrow{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .mark{stroke:#d9480f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#111827}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#374151}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111827}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="24" y="34" class="title">PLC seven-segment display outputs</text>

  <rect x="100" y="80" width="170" height="210" class="box"/><text x="135" y="112" class="txt">BCD input</text><text x="130" y="140" class="small">I0 I1 I2 I3</text>
  <rect x="385" y="70" width="190" height="230" class="box"/><text x="425" y="108" class="txt">PLC logic</text><text x="410" y="140" class="small">K-map equations</text><text x="410" y="165" class="small">segments a-g</text>
  <rect x="690" y="80" width="110" height="210" class="box"/><text x="730" y="118" class="txt">a</text><text x="712" y="148" class="txt">f   b</text><text x="730" y="178" class="txt">g</text><text x="712" y="208" class="txt">e   c</text><text x="730" y="238" class="txt">d</text>
  <path class="arrow" d="M270 185 L385 185"/><path class="arrow" d="M575 185 L690 185"/>
  <text x="350" y="333" class="small">Each rung energizes one segment coil when its Boolean equation is true.</text>

</svg>
