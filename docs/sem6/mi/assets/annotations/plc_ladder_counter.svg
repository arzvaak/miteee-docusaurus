<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#1f2937;stroke-width:2;rx:8}
      .wire{stroke:#1f2937;stroke-width:2;fill:none}
      .arrow{stroke:#1f2937;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .mark{stroke:#d9480f;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .txt{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#111827}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#374151}
      .title{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#111827}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
  <text x="24" y="34" class="title">PLC ladder counter with comparator and outputs</text>

  <path class="wire" d="M80 80 L80 300 M820 80 L820 300"/>
  <path class="wire" d="M80 120 L185 120 M300 120 L455 120 M610 120 L820 120"/>
  <rect x="185" y="97" width="115" height="46" class="box"/><text x="204" y="126" class="txt">Entry PE</text>
  <rect x="455" y="92" width="155" height="56" class="box"/><text x="476" y="121" class="txt">CTU count</text><text x="489" y="140" class="small">PV = capacity</text>
  <path class="wire" d="M80 205 L185 205 M300 205 L455 205 M610 205 L820 205"/>
  <rect x="185" y="182" width="115" height="46" class="box"/><text x="208" y="211" class="txt">Exit PE</text>
  <rect x="455" y="177" width="155" height="56" class="box"/><text x="476" y="206" class="txt">CTD count</text><text x="489" y="225" class="small">decrement</text>
  <path class="wire" d="M80 275 L380 275 M535 275 L820 275"/>
  <rect x="380" y="248" width="155" height="56" class="box"/><text x="400" y="279" class="txt">CMP count</text>
  <text x="650" y="263" class="txt">Green if count &lt; limit</text><text x="650" y="292" class="txt">Red if count &gt;= limit</text>

</svg>
