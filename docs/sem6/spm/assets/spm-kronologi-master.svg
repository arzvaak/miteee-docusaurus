<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Peta kronologis Sejarah Pemikiran Modern</title>
  <desc id="desc">Infografik alur dari Yunani Kuno sampai pemikiran kontemporer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#1f1b3d"/>
      <stop offset="1" stop-color="#0f3b4a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#f6c177"/>
      <stop offset="0.55" stop-color="#c4a7e7"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .title{font:800 42px Inter,Arial,sans-serif;fill:#f8fafc}
      .sub{font:500 20px Inter,Arial,sans-serif;fill:#cbd5e1}
      .period{font:800 23px Inter,Arial,sans-serif;fill:#fff}
      .small{font:600 15px Inter,Arial,sans-serif;fill:#dbeafe}
      .note{font:500 14px Inter,Arial,sans-serif;fill:#cbd5e1}
      .num{font:900 22px Inter,Arial,sans-serif;fill:#111827}
      .box{fill:rgba(15,23,42,.76);stroke:rgba(255,255,255,.2);stroke-width:2}
    </style>
  </defs>
  <rect width="1400" height="820" rx="36" fill="url(#bg)"/>
  <circle cx="115" cy="110" r="150" fill="#f6c177" opacity=".09"/>
  <circle cx="1240" cy="705" r="180" fill="#67e8f9" opacity=".08"/>
  <text x="70" y="82" class="title">Peta Kronologis Sejarah Pemikiran Modern</text>
  <text x="72" y="118" class="sub">Baca dari kiri ke kanan: akar klasik -> fondasi modern -> kritik objektif/subjektif -> kontemporer.</text>

  <path d="M115 280 C280 170 430 370 570 260 S850 175 980 310 S1125 520 1290 390" fill="none" stroke="url(#line)" stroke-width="9" stroke-linecap="round"/>
  <path d="M910 430 C1000 510 1120 610 1265 620" fill="none" stroke="#67e8f9" stroke-width="7" stroke-linecap="round" opacity=".85"/>

  <g filter="url(#shadow)">
    <g transform="translate(62 196)">
      <rect class="box" width="205" height="132" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#f6c177"/><text x="31" y="46" class="num">1</text>
      <text x="72" y="42" class="period">Yunani</text>
      <text x="28" y="78" class="small">Plato: ide</text>
      <text x="28" y="103" class="small">Aristoteles: observasi</text>
    </g>
    <g transform="translate(285 300)">
      <rect class="box" width="205" height="132" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#f6c177"/><text x="31" y="46" class="num">2</text>
      <text x="72" y="42" class="period">Abad Tengah</text>
      <text x="28" y="78" class="small">teologi</text>
      <text x="28" y="103" class="small">skolastisisme</text>
    </g>
    <g transform="translate(512 182)">
      <rect class="box" width="205" height="132" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#f6c177"/><text x="31" y="46" class="num">3</text>
      <text x="72" y="42" class="period">Renaissance</text>
      <text x="28" y="78" class="small">humanisme</text>
      <text x="28" y="103" class="small">alam &amp; manusia</text>
    </g>
    <g transform="translate(735 265)">
      <rect class="box" width="205" height="132" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#c4a7e7"/><text x="31" y="46" class="num">4</text>
      <text x="72" y="42" class="period">Fondasi</text>
      <text x="28" y="78" class="small">rasionalisme</text>
      <text x="28" y="103" class="small">empirisme</text>
    </g>
    <g transform="translate(958 190)">
      <rect class="box" width="205" height="132" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#c4a7e7"/><text x="31" y="46" class="num">5</text>
      <text x="72" y="42" class="period">Pencerahan</text>
      <text x="28" y="78" class="small">politik modern</text>
      <text x="28" y="103" class="small">sintesis Kant</text>
    </g>
    <g transform="translate(1128 346)">
      <rect class="box" width="205" height="132" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#c4a7e7"/><text x="31" y="46" class="num">6</text>
      <text x="72" y="42" class="period">Idealisme</text>
      <text x="28" y="78" class="small">Fichte, Schelling</text>
      <text x="28" y="103" class="small">Hegel</text>
    </g>
    <g transform="translate(755 505)">
      <rect class="box" width="250" height="150" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#67e8f9"/><text x="31" y="46" class="num">7A</text>
      <text x="76" y="42" class="period">Objektif</text>
      <text x="28" y="82" class="small">Comte, Marx</text>
      <text x="28" y="108" class="small">Darwin, Freud</text>
      <text x="28" y="132" class="note">fakta, materi, alam</text>
    </g>
    <g transform="translate(1035 555)">
      <rect class="box" width="250" height="150" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#67e8f9"/><text x="31" y="46" class="num">7B</text>
      <text x="76" y="42" class="period">Subjektif</text>
      <text x="28" y="82" class="small">Nietzsche, Husserl</text>
      <text x="28" y="108" class="small">Heidegger, Sartre</text>
      <text x="28" y="132" class="note">kehendak &amp; eksistensi</text>
    </g>
    <g transform="translate(470 602)">
      <rect class="box" width="250" height="150" rx="22"/>
      <circle cx="38" cy="38" r="22" fill="#67e8f9"/><text x="31" y="46" class="num">8</text>
      <text x="76" y="42" class="period">Kontemporer</text>
      <text x="28" y="82" class="small">bahasa, struktur</text>
      <text x="28" y="108" class="small">wacana, gender</text>
      <text x="28" y="132" class="note">makna tidak netral</text>
    </g>
  </g>
</svg>
