<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Lensa ujian Minggu 4 pencerahan dan Kant</title>
  <desc id="desc">Infografik wilayah Pencerahan Inggris Perancis Jerman dan sintesis Kant.</desc>
  <rect width="1400" height="560" rx="30" fill="#1f2937"/>
  <text x="64" y="74" fill="#fff7ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800">Minggu 4 - Pencerahan dan Kant</text>
  <text x="64" y="116" fill="#fed7aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Pakai peta wilayah dulu, lalu tutup dengan Kant sebagai sintesis rasio dan pengalaman.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="245" cy="260" r="112" fill="#eff6ff"/>
    <text x="190" y="225" fill="#1d4ed8" font-size="27" font-weight="800">Inggris</text>
    <text x="170" y="265" fill="#1e3a8a" font-size="20">Berkeley, Hume</text>
    <text x="160" y="296" fill="#1e3a8a" font-size="20">empirisme kritis</text>
    <circle cx="540" cy="260" r="112" fill="#fef2f2"/>
    <text x="480" y="225" fill="#b91c1c" font-size="27" font-weight="800">Perancis</text>
    <text x="462" y="265" fill="#7f1d1d" font-size="20">politik, deisme,</text>
    <text x="475" y="296" fill="#7f1d1d" font-size="20">kontrak sosial</text>
    <circle cx="835" cy="260" r="112" fill="#f0fdf4"/>
    <text x="780" y="225" fill="#15803d" font-size="27" font-weight="800">Jerman</text>
    <text x="760" y="265" fill="#14532d" font-size="20">Kant dan kritik</text>
    <text x="765" y="296" fill="#14532d" font-size="20">batas rasio</text>
    <rect x="1050" y="164" width="270" height="192" rx="26" fill="#fffbeb" stroke="#f59e0b" stroke-width="4"/>
    <text x="1092" y="212" fill="#92400e" font-size="30" font-weight="800">Kant</text>
    <text x="1092" y="254" fill="#78350f" font-size="21">Isi: pengalaman</text>
    <text x="1092" y="288" fill="#78350f" font-size="21">Bentuk: rasio</text>
    <text x="1092" y="322" fill="#92400e" font-size="19" font-weight="800">Hasil: fenomena</text>
    <path d="M935 260 H1038" stroke="#f59e0b" stroke-width="6"/>
    <rect x="100" y="420" width="1200" height="72" rx="20" fill="#111827" stroke="#fb923c"/>
    <text x="132" y="465" fill="#ffedd5" font-size="22" font-weight="700">Kalimat kunci: Pencerahan menjadikan akal alat kritik sosial; Kant menjadikan akal alat penyusun pengalaman.</text>
  </g>
</svg>
