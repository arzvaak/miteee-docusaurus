<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Rubrik 10 poin jawaban esai Sejarah Pemikiran Modern</title>
  <desc id="desc">Infografik rubrik jawaban esai dengan lima bagian: tesis, kronologi, konsep, perbandingan, dan penutup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.55" stop-color="#eef7f4"/>
      <stop offset="1" stop-color="#f7efe5"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#23313a" flood-opacity=".16"/>
    </filter>
    <style>
      .title{font:700 42px Arial,Helvetica,sans-serif;fill:#17252d}
      .sub{font:500 21px Arial,Helvetica,sans-serif;fill:#455861}
      .card{fill:#fffdf8;stroke:#d9e3df;stroke-width:2;rx:22;filter:url(#shadow)}
      .mini{fill:#fbf7ee;stroke:#e4d5c2;stroke-width:2;rx:18}
      .h{font:700 26px Arial,Helvetica,sans-serif;fill:#14232a}
      .p{font:500 19px Arial,Helvetica,sans-serif;fill:#394b52}
      .score{font:800 34px Arial,Helvetica,sans-serif;fill:#0e6655}
      .num{font:800 24px Arial,Helvetica,sans-serif;fill:#ffffff}
      .tag{font:700 17px Arial,Helvetica,sans-serif;fill:#6d3c13}
      .line{stroke:#2c6b64;stroke-width:7;stroke-linecap:round;fill:none}
      .thin{stroke:#d49a42;stroke-width:4;stroke-linecap:round;fill:none}
      .dot{fill:#2c6b64}
      .warn{fill:#fff2df;stroke:#e5a14b;stroke-width:2;rx:18}
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <circle cx="1120" cy="94" r="82" fill="#d64242" opacity=".08"/>
  <circle cx="118" cy="646" r="110" fill="#0e6655" opacity=".08"/>
  <text x="70" y="78" class="title">Rubrik Esai 10 Poin</text>
  <text x="72" y="114" class="sub">Gunakan untuk menilai jawaban sendiri sebelum ujian: isi harus kronologis, konsep harus tepat.</text>

  <rect x="66" y="160" width="1148" height="430" class="card"/>
  <path class="line" d="M154 380H1108"/>
  <g>
    <circle class="dot" cx="178" cy="380" r="34"/><text x="170" y="388" class="num">1</text>
    <rect x="116" y="214" width="190" height="116" class="mini"/>
    <text x="142" y="248" class="h">Tesis</text>
    <text x="142" y="280" class="p">jawaban langsung</text>
    <text x="142" y="306" class="score">2 poin</text>
  </g>
  <g>
    <circle class="dot" cx="410" cy="380" r="34"/><text x="402" y="388" class="num">2</text>
    <rect x="330" y="430" width="210" height="118" class="mini"/>
    <text x="356" y="466" class="h">Kronologi</text>
    <text x="356" y="498" class="p">sebab lalu akibat</text>
    <text x="356" y="524" class="score">2 poin</text>
  </g>
  <g>
    <circle class="dot" cx="642" cy="380" r="34"/><text x="634" y="388" class="num">3</text>
    <rect x="552" y="214" width="214" height="116" class="mini"/>
    <text x="578" y="248" class="h">Konsep</text>
    <text x="578" y="280" class="p">istilah inti benar</text>
    <text x="578" y="306" class="score">3 poin</text>
  </g>
  <g>
    <circle class="dot" cx="874" cy="380" r="34"/><text x="866" y="388" class="num">4</text>
    <rect x="790" y="430" width="222" height="118" class="mini"/>
    <text x="816" y="466" class="h">Bandingkan</text>
    <text x="816" y="498" class="p">bedakan, jangan campur</text>
    <text x="816" y="524" class="score">2 poin</text>
  </g>
  <g>
    <circle class="dot" cx="1106" cy="380" r="34"/><text x="1098" y="388" class="num">5</text>
    <rect x="995" y="214" width="190" height="116" class="mini"/>
    <text x="1022" y="248" class="h">Penutup</text>
    <text x="1022" y="280" class="p">makna historis</text>
    <text x="1022" y="306" class="score">1 poin</text>
  </g>
  <path class="thin" d="M178 346V332M410 414V430M642 346V332M874 414V430M1106 346V332"/>

  <rect x="86" y="626" width="336" height="74" class="warn"/>
  <text x="112" y="656" class="tag">Sinyal jawaban kuat</text>
  <text x="112" y="682" class="p">ada tesis + urutan + tokoh + istilah</text>
  <rect x="472" y="626" width="336" height="74" class="warn"/>
  <text x="498" y="656" class="tag">Sinyal jawaban lemah</text>
  <text x="498" y="682" class="p">hanya definisi, tanpa alur sejarah</text>
  <rect x="858" y="626" width="336" height="74" class="warn"/>
  <text x="884" y="656" class="tag">Target 3 hari</text>
  <text x="884" y="682" class="p">latih 6 esai pendek, nilai dengan rubrik</text>
</svg>
