<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Siklus recall 72 jam sebelum ujian SPM</title>
  <desc id="desc">Infografik siklus belajar 72 jam terakhir untuk ujian Sejarah Pemikiran Modern.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1400" height="620" rx="32" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="76" fill="#f8fafc" font-size="42" font-weight="850">Siklus Recall 72 Jam</text>
    <text x="64" y="118" fill="#ccfbf1" font-size="22">Untuk ujian dekat: belajar harus aktif, bukan sekadar baca ulang.</text>
    <circle cx="700" cy="330" r="150" fill="#0f172a" stroke="#fbbf24" stroke-width="6"/>
    <text x="626" y="314" fill="#fef3c7" font-size="30" font-weight="850">Tulis</text>
    <text x="575" y="352" fill="#fef9c3" font-size="22">jawaban tanpa melihat</text>
    <text x="596" y="386" fill="#fef9c3" font-size="22">catatan dahulu</text>
    <g fill="#ffffff">
      <rect x="85" y="220" width="300" height="125" rx="24" fill="#ecfeff"/>
      <text x="122" y="264" fill="#0e7490" font-size="27" font-weight="800">72-48 jam</text>
      <text x="122" y="302" fill="#164e63" font-size="21">Bangun kronologi</text>
      <text x="122" y="333" fill="#164e63" font-size="21">dan peta tokoh.</text>
      <rect x="1015" y="220" width="300" height="125" rx="24" fill="#fef3c7"/>
      <text x="1052" y="264" fill="#92400e" font-size="27" font-weight="800">48-24 jam</text>
      <text x="1052" y="302" fill="#78350f" font-size="21">Latih bandingan</text>
      <text x="1052" y="333" fill="#78350f" font-size="21">dan konsep kunci.</text>
      <rect x="270" y="468" width="300" height="105" rx="24" fill="#f5f3ff"/>
      <text x="307" y="512" fill="#6d28d9" font-size="27" font-weight="800">24-6 jam</text>
      <text x="307" y="550" fill="#4c1d95" font-size="21">Tulis esai mini.</text>
      <rect x="830" y="468" width="300" height="105" rx="24" fill="#fee2e2"/>
      <text x="867" y="512" fill="#b91c1c" font-size="27" font-weight="800">6-0 jam</text>
      <text x="867" y="550" fill="#7f1d1d" font-size="21">Review kesalahan.</text>
    </g>
    <g fill="none" stroke="#fbbf24" stroke-width="6" marker-end="url(#arrow)">
      <path d="M388 278 C500 230 575 225 625 240"/>
      <path d="M775 240 C840 220 930 230 1004 278"/>
      <path d="M1090 350 C1060 420 1015 455 975 465"/>
      <path d="M425 465 C365 430 330 390 310 350"/>
    </g>
    <rect x="500" y="150" width="400" height="62" rx="18" fill="#042f2e" stroke="#5eead4"/>
    <text x="542" y="190" fill="#ccfbf1" font-size="24" font-weight="800">Baca -> tutup -> tulis -> cek -> ulang</text>
  </g>
</svg>
