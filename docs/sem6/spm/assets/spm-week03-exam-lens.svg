<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Lensa ujian Minggu 3 empirisme</title>
  <desc id="desc">Infografik alur empirisme, idola Bacon, dan perbandingan Hobbes Locke.</desc>
  <rect width="1400" height="560" rx="30" fill="#082f49"/>
  <text x="64" y="74" fill="#f0f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800">Minggu 3 - Empirisme</text>
  <text x="64" y="116" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Rumus ujian: pengalaman memberi bahan, metode membersihkan bias, politik lahir dari pandangan manusia.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="75" y="170" width="260" height="115" rx="22" fill="#ecfeff"/>
    <text x="105" y="215" fill="#155e75" font-size="27" font-weight="800">Pengalaman</text>
    <text x="105" y="252" fill="#164e63" font-size="20">Indera memberi data.</text>
    <rect x="405" y="170" width="260" height="115" rx="22" fill="#f0fdf4"/>
    <text x="435" y="215" fill="#166534" font-size="27" font-weight="800">Observasi</text>
    <text x="435" y="252" fill="#14532d" font-size="20">Data diuji metodis.</text>
    <rect x="735" y="170" width="260" height="115" rx="22" fill="#fffbeb"/>
    <text x="765" y="215" fill="#92400e" font-size="27" font-weight="800">Bersihkan</text>
    <text x="765" y="252" fill="#78350f" font-size="20">Lawan empat idola.</text>
    <rect x="1065" y="170" width="260" height="115" rx="22" fill="#fef2f2"/>
    <text x="1095" y="215" fill="#991b1b" font-size="27" font-weight="800">Ilmu</text>
    <text x="1095" y="252" fill="#7f1d1d" font-size="20">Pengetahuan objektif.</text>
    <path d="M345 228 H392M675 228 H722M1005 228 H1052" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <rect x="75" y="350" width="395" height="110" rx="22" fill="#0f172a" stroke="#7dd3fc"/>
    <text x="105" y="389" fill="#7dd3fc" font-size="24" font-weight="800">Bacon</text>
    <text x="105" y="426" fill="#e0f2fe" font-size="20">Tribus, specus, fori, theatri:</text>
    <text x="105" y="454" fill="#e0f2fe" font-size="20">bias harus disaring.</text>
    <rect x="502" y="350" width="395" height="110" rx="22" fill="#0f172a" stroke="#86efac"/>
    <text x="532" y="389" fill="#86efac" font-size="24" font-weight="800">Hobbes</text>
    <text x="532" y="426" fill="#dcfce7" font-size="20">Manusia egoistik; negara kuat</text>
    <text x="532" y="454" fill="#dcfce7" font-size="20">dibutuhkan untuk tertib.</text>
    <rect x="929" y="350" width="395" height="110" rx="22" fill="#0f172a" stroke="#fde68a"/>
    <text x="959" y="389" fill="#fde68a" font-size="24" font-weight="800">Locke</text>
    <text x="959" y="426" fill="#fef3c7" font-size="20">Hak dan hukum alamiah;</text>
    <text x="959" y="454" fill="#fef3c7" font-size="20">negara melindungi warga.</text>
  </g>
</svg>
