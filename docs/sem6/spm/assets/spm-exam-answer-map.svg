<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Format jawaban esai Sejarah Pemikiran Modern</title>
  <desc id="desc">Infografik lima langkah menjawab soal esai.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#151829"/><stop offset="1" stop-color="#2d1b54"/></linearGradient>
    <linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#f6c177"/><stop offset="1" stop-color="#c4a7e7"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".30"/></filter>
    <style>
      .h{font:900 36px Inter,Arial,sans-serif;fill:#fff}
      .sub{font:600 17px Inter,Arial,sans-serif;fill:#cbd5e1}
      .k{font:800 24px Inter,Arial,sans-serif;fill:#fff}
      .t{font:600 16px Inter,Arial,sans-serif;fill:#dbeafe}
      .n{font:900 26px Inter,Arial,sans-serif;fill:#111827}
      .box{fill:rgba(15,23,42,.78);stroke:rgba(255,255,255,.18);stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="650" rx="34" fill="url(#bg)"/>
  <text x="58" y="72" class="h">Template Jawaban Esai</text>
  <text x="60" y="108" class="sub">Pakai struktur ini untuk hampir semua soal perbandingan dan alur sejarah.</text>
  <path d="M155 340H1045" stroke="url(#a)" stroke-width="10" stroke-linecap="round"/>
  <g filter="url(#sh)">
    <g transform="translate(70 210)">
      <rect width="190" height="210" rx="24" class="box"/><circle cx="95" cy="45" r="25" fill="#f6c177"/><text x="87" y="54" class="n">1</text>
      <text x="52" y="103" class="k">Tesis</text><text x="33" y="146" class="t">jawab langsung</text><text x="33" y="176" class="t">dalam 1 kalimat</text>
    </g>
    <g transform="translate(290 210)">
      <rect width="190" height="210" rx="24" class="box"/><circle cx="95" cy="45" r="25" fill="#f6c177"/><text x="87" y="54" class="n">2</text>
      <text x="35" y="103" class="k">Konteks</text><text x="31" y="146" class="t">posisi dalam</text><text x="31" y="176" class="t">kronologi</text>
    </g>
    <g transform="translate(510 210)">
      <rect width="190" height="210" rx="24" class="box"/><circle cx="95" cy="45" r="25" fill="#c4a7e7"/><text x="87" y="54" class="n">3</text>
      <text x="36" y="103" class="k">Konsep</text><text x="31" y="146" class="t">2-4 istilah</text><text x="31" y="176" class="t">kunci</text>
    </g>
    <g transform="translate(730 210)">
      <rect width="190" height="210" rx="24" class="box"/><circle cx="95" cy="45" r="25" fill="#c4a7e7"/><text x="87" y="54" class="n">4</text>
      <text x="19" y="103" class="k">Bandingkan</text><text x="31" y="146" class="t">tokoh sebelum</text><text x="31" y="176" class="t">atau sesudah</text>
    </g>
    <g transform="translate(950 210)">
      <rect width="190" height="210" rx="24" class="box"/><circle cx="95" cy="45" r="25" fill="#67e8f9"/><text x="87" y="54" class="n">5</text>
      <text x="20" y="103" class="k">Kesimpulan</text><text x="31" y="146" class="t">makna bagi</text><text x="31" y="176" class="t">modernitas</text>
    </g>
  </g>
</svg>
