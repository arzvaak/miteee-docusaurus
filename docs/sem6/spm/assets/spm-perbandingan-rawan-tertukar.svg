<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Perbandingan rawan tertukar Sejarah Pemikiran Modern</title>
  <desc id="desc">Infografik pasangan konsep filsafat modern yang sering tertukar dalam ujian.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1f3a5f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1500" height="760" rx="34" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="78" fill="#f8fafc" font-size="42" font-weight="850">Rawan Tertukar</text>
    <text x="64" y="120" fill="#bfdbfe" font-size="22">Bedakan pasangan konsep ini sebelum menulis jawaban esai.</text>
    <g filter="url(#shadow)">
      <rect x="82" y="180" width="405" height="150" rx="24" fill="#eff6ff"/>
      <text x="118" y="226" fill="#1d4ed8" font-size="27" font-weight="850">Rasionalisme</text>
      <text x="118" y="265" fill="#1e3a8a" font-size="21">Akal mencari dasar pasti.</text>
      <text x="118" y="300" fill="#1e3a8a" font-size="21">Descartes, Spinoza, Leibniz.</text>
      <rect x="548" y="180" width="405" height="150" rx="24" fill="#ecfeff"/>
      <text x="584" y="226" fill="#0e7490" font-size="27" font-weight="850">Empirisme</text>
      <text x="584" y="265" fill="#164e63" font-size="21">Pengalaman memberi bahan.</text>
      <text x="584" y="300" fill="#164e63" font-size="21">Bacon, Hobbes, Locke.</text>
      <rect x="1014" y="180" width="405" height="150" rx="24" fill="#fef3c7"/>
      <text x="1050" y="226" fill="#92400e" font-size="27" font-weight="850">Kant</text>
      <text x="1050" y="265" fill="#78350f" font-size="21">Menyintesis rasio dan</text>
      <text x="1050" y="300" fill="#78350f" font-size="21">pengalaman dalam fenomena.</text>
      <rect x="82" y="405" width="405" height="150" rx="24" fill="#f5f3ff"/>
      <text x="118" y="451" fill="#6d28d9" font-size="27" font-weight="850">Hegel</text>
      <text x="118" y="490" fill="#4c1d95" font-size="21">Dialektika ide/roh.</text>
      <text x="118" y="525" fill="#4c1d95" font-size="21">Sejarah sebagai proses rasional.</text>
      <rect x="548" y="405" width="405" height="150" rx="24" fill="#fee2e2"/>
      <text x="584" y="451" fill="#b91c1c" font-size="27" font-weight="850">Marx</text>
      <text x="584" y="490" fill="#7f1d1d" font-size="21">Dialektika material.</text>
      <text x="584" y="525" fill="#7f1d1d" font-size="21">Sejarah sebagai konflik kelas.</text>
      <rect x="1014" y="405" width="405" height="150" rx="24" fill="#dcfce7"/>
      <text x="1050" y="451" fill="#15803d" font-size="27" font-weight="850">Eksistensialisme</text>
      <text x="1050" y="490" fill="#14532d" font-size="21">Individu konkret, pilihan,</text>
      <text x="1050" y="525" fill="#14532d" font-size="21">kebebasan, tanggung jawab.</text>
    </g>
    <path d="M487 255 H540M953 255 H1006M487 480 H540M953 480 H1006" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <rect x="190" y="620" width="1120" height="72" rx="22" fill="#020617" stroke="#38bdf8"/>
    <text x="230" y="665" fill="#e0f2fe" font-size="23" font-weight="750">Kunci ujian: selalu sebut sumber pengetahuan, struktur realitas, dan akibat historisnya.</text>
  </g>
</svg>
