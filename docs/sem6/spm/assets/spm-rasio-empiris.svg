<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Infografik rasionalisme dan empirisme</title>
  <desc id="desc">Perbandingan sumber pengetahuan menurut rasionalisme, empirisme, dan sintesis Kant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#20184a"/><stop offset="1" stop-color="#073b4c"/></linearGradient>
    <linearGradient id="mid" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".28"/></filter>
    <style>
      .h{font:900 38px Inter,Arial,sans-serif;fill:#fff}
      .k{font:800 25px Inter,Arial,sans-serif;fill:#fff}
      .t{font:600 19px Inter,Arial,sans-serif;fill:#e0f2fe}
      .sm{font:600 16px Inter,Arial,sans-serif;fill:#cbd5e1}
      .card{fill:rgba(15,23,42,.78);stroke:rgba(255,255,255,.18);stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <text x="55" y="72" class="h">Rasio vs Pengalaman</text>
  <text x="56" y="108" class="sm">Soal ujian biasanya meminta posisi, perbandingan, lalu sintesis Kant.</text>
  <g filter="url(#s)">
    <rect x="60" y="150" width="340" height="405" rx="28" class="card"/>
    <circle cx="230" cy="245" r="68" fill="#a78bfa" opacity=".25"/>
    <path d="M190 245h80M230 205v80M197 218l66 54M263 218l-66 54" stroke="#ddd6fe" stroke-width="7" stroke-linecap="round"/>
    <text x="110" y="365" class="k">Rasionalisme</text>
    <text x="100" y="410" class="t">dasar: akal</text>
    <text x="100" y="448" class="t">target: kepastian</text>
    <text x="100" y="486" class="t">tokoh: Descartes</text>
  </g>
  <g filter="url(#s)">
    <rect x="880" y="150" width="340" height="405" rx="28" class="card"/>
    <circle cx="1050" cy="245" r="68" fill="#2dd4bf" opacity=".25"/>
    <path d="M1008 238c22-40 63-40 84 0-21 40-62 40-84 0z" fill="none" stroke="#99f6e4" stroke-width="8"/>
    <circle cx="1050" cy="238" r="18" fill="#99f6e4"/>
    <text x="945" y="365" class="k">Empirisme</text>
    <text x="920" y="410" class="t">dasar: pengalaman</text>
    <text x="920" y="448" class="t">target: observasi</text>
    <text x="920" y="486" class="t">tokoh: Bacon, Locke</text>
  </g>
  <path d="M420 350H860" stroke="url(#mid)" stroke-width="12" stroke-linecap="round"/>
  <polygon points="835,330 880,350 835,370" fill="#2dd4bf"/>
  <polygon points="445,330 400,350 445,370" fill="#a78bfa"/>
  <g filter="url(#s)">
    <rect x="470" y="210" width="340" height="285" rx="28" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.24)" stroke-width="2"/>
    <text x="565" y="272" class="k">Kant</text>
    <text x="525" y="325" class="t">isi dari pengalaman</text>
    <text x="525" y="365" class="t">bentuk dari rasio</text>
    <text x="525" y="405" class="t">hasil: fenomena</text>
  </g>
</svg>
