<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Lensa ujian Minggu 5 idealisme</title>
  <desc id="desc">Infografik urutan Fichte, Schelling, Hegel, dan reaksi setelah Hegel.</desc>
  <rect width="1400" height="560" rx="30" fill="#2e1065"/>
  <text x="64" y="74" fill="#faf5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800">Minggu 5 - Idealisme Jerman</text>
  <text x="64" y="116" fill="#e9d5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Jawaban kuat membandingkan titik awal: aku, identitas, lalu roh/dialektika.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="92" y="185" width="300" height="135" rx="24" fill="#faf5ff"/>
    <text x="126" y="232" fill="#7e22ce" font-size="29" font-weight="800">Fichte</text>
    <text x="126" y="272" fill="#3b0764" font-size="21">Aku absolut aktif</text>
    <text x="126" y="302" fill="#3b0764" font-size="21">membentuk bukan-aku.</text>
    <rect x="550" y="185" width="300" height="135" rx="24" fill="#eef2ff"/>
    <text x="584" y="232" fill="#4338ca" font-size="29" font-weight="800">Schelling</text>
    <text x="584" y="272" fill="#312e81" font-size="21">Subjek dan objek</text>
    <text x="584" y="302" fill="#312e81" font-size="21">berasal dari Absolut.</text>
    <rect x="1008" y="185" width="300" height="135" rx="24" fill="#ecfeff"/>
    <text x="1042" y="232" fill="#0e7490" font-size="29" font-weight="800">Hegel</text>
    <text x="1042" y="272" fill="#164e63" font-size="21">Roh bergerak lewat</text>
    <text x="1042" y="302" fill="#164e63" font-size="21">dialektika sejarah.</text>
    <path d="M402 252 H538M860 252 H998" stroke="#f0abfc" stroke-width="6" stroke-linecap="round"/>
    <rect x="92" y="400" width="1216" height="80" rx="22" fill="#111827" stroke="#f0abfc"/>
    <text x="126" y="435" fill="#f0abfc" font-size="24" font-weight="800">Sesudah Hegel</text>
    <text x="126" y="466" fill="#fae8ff" font-size="21">Feuerbach dan Marx membalik; positivisme menolak spekulasi; eksistensialisme membela individu konkret.</text>
  </g>
</svg>
