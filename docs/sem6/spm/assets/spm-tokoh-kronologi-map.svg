<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Peta tokoh kronologis Sejarah Pemikiran Modern</title>
  <desc id="desc">Infografik urutan tokoh dan kata kunci dari Plato sampai feminisme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#24305f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  </defs>
  <rect width="1500" height="760" rx="34" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="78" fill="#f8fafc" font-size="42" font-weight="850">Tokoh, Urutan, Kata Kunci</text>
    <text x="64" y="120" fill="#bfdbfe" font-size="22">Gunakan peta ini untuk mengingat siapa membawa konsep apa, lalu susun jawaban kronologis.</text>
    <g filter="url(#shadow)">
      <rect x="72" y="180" width="220" height="124" rx="22" fill="#fff7ed"/><text x="102" y="224" fill="#9a3412" font-size="25" font-weight="850">Plato</text><text x="102" y="258" fill="#431407" font-size="19">Ide/forms</text><text x="102" y="286" fill="#431407" font-size="19">akar idealisme</text>
      <rect x="322" y="180" width="220" height="124" rx="22" fill="#ecfeff"/><text x="352" y="224" fill="#0e7490" font-size="25" font-weight="850">Aristoteles</text><text x="352" y="258" fill="#164e63" font-size="19">Observasi</text><text x="352" y="286" fill="#164e63" font-size="19">sebab konkret</text>
      <rect x="572" y="180" width="220" height="124" rx="22" fill="#f5f3ff"/><text x="602" y="224" fill="#6d28d9" font-size="25" font-weight="850">Descartes</text><text x="602" y="258" fill="#4c1d95" font-size="19">Cogito</text><text x="602" y="286" fill="#4c1d95" font-size="19">dualisme</text>
      <rect x="822" y="180" width="220" height="124" rx="22" fill="#eff6ff"/><text x="852" y="224" fill="#1d4ed8" font-size="25" font-weight="850">Bacon-Locke</text><text x="852" y="258" fill="#1e3a8a" font-size="19">Pengalaman</text><text x="852" y="286" fill="#1e3a8a" font-size="19">bias dan hak</text>
      <rect x="1072" y="180" width="220" height="124" rx="22" fill="#fef3c7"/><text x="1102" y="224" fill="#92400e" font-size="25" font-weight="850">Kant</text><text x="1102" y="258" fill="#78350f" font-size="19">Isi + bentuk</text><text x="1102" y="286" fill="#78350f" font-size="19">fenomena</text>
      <rect x="197" y="408" width="220" height="124" rx="22" fill="#ede9fe"/><text x="227" y="452" fill="#5b21b6" font-size="25" font-weight="850">Hegel</text><text x="227" y="486" fill="#2e1065" font-size="19">Roh</text><text x="227" y="514" fill="#2e1065" font-size="19">dialektika</text>
      <rect x="447" y="408" width="220" height="124" rx="22" fill="#fee2e2"/><text x="477" y="452" fill="#b91c1c" font-size="25" font-weight="850">Marx</text><text x="477" y="486" fill="#7f1d1d" font-size="19">Materialisme</text><text x="477" y="514" fill="#7f1d1d" font-size="19">kelas</text>
      <rect x="697" y="408" width="220" height="124" rx="22" fill="#dcfce7"/><text x="727" y="452" fill="#15803d" font-size="25" font-weight="850">Nietzsche</text><text x="727" y="486" fill="#14532d" font-size="19">Nilai baru</text><text x="727" y="514" fill="#14532d" font-size="19">nihilisme</text>
      <rect x="947" y="408" width="220" height="124" rx="22" fill="#e0f2fe"/><text x="977" y="452" fill="#0369a1" font-size="25" font-weight="850">Husserl</text><text x="977" y="486" fill="#0c4a6e" font-size="19">Epoche</text><text x="977" y="514" fill="#0c4a6e" font-size="19">kesadaran</text>
      <rect x="1197" y="408" width="220" height="124" rx="22" fill="#fce7f3"/><text x="1227" y="452" fill="#be185d" font-size="25" font-weight="850">Kontemporer</text><text x="1227" y="486" fill="#831843" font-size="19">Bahasa</text><text x="1227" y="514" fill="#831843" font-size="19">wacana, gender</text>
    </g>
    <path d="M292 242 H314M542 242 H564M792 242 H814M1042 242 H1064M1182 312 C1090 375 960 402 807 402 C640 402 505 398 417 458M417 470 H439M667 470 H689M917 470 H939M1167 470 H1189" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
    <rect x="150" y="610" width="1200" height="76" rx="22" fill="#020617" stroke="#38bdf8"/>
    <text x="188" y="657" fill="#e0f2fe" font-size="23" font-weight="750">Rumus hafalan: tokoh bukan dihafal terpisah, tetapi sebagai reaksi terhadap masalah sebelumnya.</text>
  </g>
</svg>
