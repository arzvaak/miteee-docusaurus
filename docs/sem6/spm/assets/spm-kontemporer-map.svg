<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Peta pemikiran kontemporer</title>
  <desc id="desc">Infografik tema bahasa, struktur, interpretasi, kekuasaan, identitas, dan gender.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset=".55" stop-color="#182747"/><stop offset="1" stop-color="#331433"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".32"/></filter>
    <style>
      .h{font:900 38px Inter,Arial,sans-serif;fill:#fff}
      .sub{font:600 17px Inter,Arial,sans-serif;fill:#cbd5e1}
      .k{font:800 24px Inter,Arial,sans-serif;fill:#fff}
      .t{font:600 17px Inter,Arial,sans-serif;fill:#e5e7eb}
      .box{fill:rgba(15,23,42,.78);stroke:rgba(255,255,255,.20);stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="760" rx="34" fill="url(#bg)"/>
  <text x="58" y="72" class="h">Pemikiran Kontemporer: Makna Tidak Netral</text>
  <text x="60" y="108" class="sub">Pusat masalah bergeser dari subjek rasional tunggal ke bahasa, struktur, wacana, dan identitas.</text>
  <g stroke="rgba(255,255,255,.22)" stroke-width="3">
    <line x1="640" y1="360" x2="240" y2="230"/><line x1="640" y1="360" x2="1040" y2="230"/>
    <line x1="640" y1="360" x2="250" y2="525"/><line x1="640" y1="360" x2="1030" y2="525"/>
    <line x1="640" y1="360" x2="640" y2="615"/><line x1="640" y1="360" x2="640" y2="170"/>
  </g>
  <g filter="url(#sh)">
    <circle cx="640" cy="360" r="118" fill="rgba(103,232,249,.16)" stroke="#67e8f9" stroke-width="4"/>
    <text x="584" y="340" class="k">Subjek</text>
    <text x="540" y="378" class="t">dibentuk oleh</text>
    <text x="558" y="413" class="t">sistem sosial</text>
    <rect x="90" y="175" width="300" height="122" rx="24" class="box"/>
    <text x="130" y="222" class="k">Bahasa</text>
    <text x="130" y="262" class="t">Saussure: tanda</text>
    <rect x="890" y="175" width="300" height="122" rx="24" class="box"/>
    <text x="930" y="222" class="k">Struktur</text>
    <text x="930" y="262" class="t">langue, sistem, relasi</text>
    <rect x="90" y="470" width="320" height="122" rx="24" class="box"/>
    <text x="130" y="517" class="k">Interpretasi</text>
    <text x="130" y="557" class="t">hermeneutika</text>
    <rect x="870" y="470" width="320" height="122" rx="24" class="box"/>
    <text x="910" y="517" class="k">Wacana</text>
    <text x="910" y="557" class="t">kuasa dan makna</text>
    <rect x="490" y="600" width="300" height="110" rx="24" class="box"/>
    <text x="535" y="646" class="k">Gender</text>
    <text x="535" y="684" class="t">seks vs konstruksi sosial</text>
    <rect x="490" y="125" width="300" height="110" rx="24" class="box"/>
    <text x="533" y="171" class="k">Postmodern</text>
    <text x="533" y="209" class="t">kritik narasi besar</text>
  </g>
</svg>
