<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Peta tipe soal ujian Sejarah Pemikiran Modern</title>
  <desc id="desc">Infografik tipe soal esai dan gerakan jawaban yang sesuai.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1400" height="620" rx="32" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="76" fill="#f8fafc" font-size="42" font-weight="850">Peta Tipe Soal Ujian</text>
    <text x="64" y="118" fill="#bfdbfe" font-size="22">Baca kata kerja soal dulu, lalu pilih struktur jawaban. Ini mencegah jawaban melebar.</text>
    <g filter="url(#shadow)">
      <rect x="72" y="178" width="288" height="160" rx="24" fill="#eff6ff"/>
      <text x="105" y="224" fill="#1d4ed8" font-size="27" font-weight="800">Jelaskan Konsep</text>
      <text x="105" y="264" fill="#1e3a8a" font-size="20">Definisi</text>
      <text x="105" y="295" fill="#1e3a8a" font-size="20">Konteks sejarah</text>
      <text x="105" y="326" fill="#1e3a8a" font-size="20">Makna modernitas</text>
      <rect x="392" y="178" width="288" height="160" rx="24" fill="#f5f3ff"/>
      <text x="425" y="224" fill="#6d28d9" font-size="27" font-weight="800">Bandingkan</text>
      <text x="425" y="264" fill="#4c1d95" font-size="20">Titik awal</text>
      <text x="425" y="295" fill="#4c1d95" font-size="20">Konsep utama</text>
      <text x="425" y="326" fill="#4c1d95" font-size="20">Akibat pemikiran</text>
      <rect x="712" y="178" width="288" height="160" rx="24" fill="#ecfdf5"/>
      <text x="745" y="224" fill="#15803d" font-size="27" font-weight="800">Alur Sejarah</text>
      <text x="745" y="264" fill="#14532d" font-size="20">Urutan waktu</text>
      <text x="745" y="295" fill="#14532d" font-size="20">Sebab akibat</text>
      <text x="745" y="326" fill="#14532d" font-size="20">Reaksi berikutnya</text>
      <rect x="1032" y="178" width="288" height="160" rx="24" fill="#fff7ed"/>
      <text x="1065" y="224" fill="#c2410c" font-size="27" font-weight="800">Nilai Posisi</text>
      <text x="1065" y="264" fill="#7c2d12" font-size="20">Lebih kuat?</text>
      <text x="1065" y="295" fill="#7c2d12" font-size="20">Lebih relevan?</text>
      <text x="1065" y="326" fill="#7c2d12" font-size="20">Beri alasan</text>
    </g>
    <path d="M216 370 V420 H536 V370" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
    <path d="M856 370 V420 H1176 V370" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
    <rect x="170" y="444" width="1060" height="96" rx="26" fill="#020617" stroke="#93c5fd"/>
    <text x="210" y="482" fill="#93c5fd" font-size="25" font-weight="800">Pola jawaban aman</text>
    <text x="210" y="518" fill="#e0f2fe" font-size="22">Tesis satu kalimat -> 2 atau 3 konsep kunci -> perbandingan atau alur -> makna bagi modernitas.</text>
  </g>
</svg>
