<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Tiga rasionalis modern</title>
  <desc id="desc">Infografik Descartes, Spinoza, dan Leibniz.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%"><stop offset="0" stop-color="#34245f"/><stop offset="1" stop-color="#0f172a"/></radialGradient>
    <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".32"/></filter>
    <style>
      .h{font:900 38px Inter,Arial,sans-serif;fill:#fff}.sub{font:600 17px Inter,Arial,sans-serif;fill:#cbd5e1}
      .k{font:850 27px Inter,Arial,sans-serif;fill:#fff}.t{font:650 18px Inter,Arial,sans-serif;fill:#e5e7eb}.sm{font:650 14px Inter,Arial,sans-serif;fill:#cbd5e1}
      .card{fill:rgba(15,23,42,.82);stroke:rgba(255,255,255,.20);stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="760" rx="34" fill="url(#bg)"/>
  <text x="58" y="72" class="h">Rasionalisme: Tiga Jawaban tentang Realitas</text>
  <text x="60" y="108" class="sub">Semua mencari kepastian lewat akal, tetapi struktur realitasnya berbeda.</text>
  <g stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M640 375C505 270 390 250 250 275" stroke="#f6c177"/>
    <path d="M640 375C640 270 640 235 640 205" stroke="#c4a7e7"/>
    <path d="M640 375C775 270 890 250 1030 275" stroke="#67e8f9"/>
  </g>
  <g filter="url(#sh)">
    <circle cx="640" cy="375" r="115" fill="rgba(255,255,255,.10)" stroke="#c4a7e7" stroke-width="4"/>
    <text x="581" y="362" class="k">Akal</text>
    <text x="535" y="402" class="t">sebagai dasar</text>
    <text x="548" y="434" class="t">kepastian</text>
    <rect x="70" y="210" width="330" height="250" rx="28" class="card"/>
    <text x="112" y="270" class="k">Descartes</text>
    <text x="112" y="322" class="t">dualistik</text>
    <text x="112" y="360" class="t">pikiran dan materi</text>
    <text x="112" y="414" class="sm">metode: ragu sampai cogito</text>
    <rect x="475" y="135" width="330" height="250" rx="28" class="card"/>
    <text x="517" y="195" class="k">Spinoza</text>
    <text x="517" y="247" class="t">monistik</text>
    <text x="517" y="285" class="t">Tuhan atau alam</text>
    <text x="517" y="339" class="sm">realitas adalah satu substansi</text>
    <rect x="880" y="210" width="330" height="250" rx="28" class="card"/>
    <text x="922" y="270" class="k">Leibniz</text>
    <text x="922" y="322" class="t">pluralistik</text>
    <text x="922" y="360" class="t">banyak monade</text>
    <text x="922" y="414" class="sm">realitas terdiri dari pusat daya</text>
    <rect x="280" y="560" width="720" height="94" rx="24" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
    <text x="330" y="615" class="t">Rumus hafalan: Descartes dua, Spinoza satu, Leibniz banyak.</text>
  </g>
</svg>
