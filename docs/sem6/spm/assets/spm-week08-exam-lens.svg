<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Lensa ujian Minggu 8 pemikiran kontemporer</title>
  <desc id="desc">Infografik pemikiran kontemporer melalui bahasa, struktur, wacana, identitas, dan kritik narasi besar.</desc>
  <rect width="1400" height="560" rx="30" fill="#111827"/>
  <text x="64" y="74" fill="#f9fafb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800">Minggu 8 - Pemikiran Kontemporer</text>
  <text x="64" y="116" fill="#d1d5db" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Jangan cari satu fondasi tunggal; baca makna melalui bahasa, struktur, interpretasi, kekuasaan, dan identitas.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="70" y="172" width="240" height="116" rx="22" fill="#ecfeff"/>
    <text x="100" y="217" fill="#0e7490" font-size="25" font-weight="800">Bahasa</text>
    <text x="100" y="253" fill="#164e63" font-size="20">Saussure, tanda</text>
    <rect x="345" y="172" width="240" height="116" rx="22" fill="#f5f3ff"/>
    <text x="375" y="217" fill="#6d28d9" font-size="25" font-weight="800">Struktur</text>
    <text x="375" y="253" fill="#4c1d95" font-size="20">Sistem membentuk</text>
    <rect x="620" y="172" width="240" height="116" rx="22" fill="#fef3c7"/>
    <text x="650" y="217" fill="#92400e" font-size="25" font-weight="800">Tafsir</text>
    <text x="650" y="253" fill="#78350f" font-size="20">Hermeneutika</text>
    <rect x="895" y="172" width="240" height="116" rx="22" fill="#fee2e2"/>
    <text x="925" y="217" fill="#b91c1c" font-size="25" font-weight="800">Wacana</text>
    <text x="925" y="253" fill="#7f1d1d" font-size="20">Kuasa dan ideologi</text>
    <rect x="1170" y="172" width="160" height="116" rx="22" fill="#dcfce7"/>
    <text x="1200" y="217" fill="#15803d" font-size="25" font-weight="800">Gender</text>
    <text x="1200" y="253" fill="#14532d" font-size="20">Identitas</text>
    <path d="M320 230 H335M595 230 H610M870 230 H885M1145 230 H1160" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
    <rect x="92" y="385" width="1216" height="92" rx="22" fill="#030712" stroke="#a78bfa"/>
    <text x="126" y="421" fill="#c4b5fd" font-size="24" font-weight="800">Kunci membedakan postmodernisme</text>
    <text x="126" y="456" fill="#f5f3ff" font-size="21">Curiga pada narasi besar: kemajuan, rasio universal, identitas stabil, dan klaim tunggal tentang kebenaran.</text>
  </g>
</svg>
