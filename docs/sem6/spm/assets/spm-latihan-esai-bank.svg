<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Bank latihan esai Sejarah Pemikiran Modern</title>
  <desc id="desc">Infografik cara mengubah materi menjadi jawaban esai ujian.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".55" stop-color="#20184a"/><stop offset="1" stop-color="#073b4c"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".32"/></filter>
    <style>
      .h{font:900 38px Inter,Arial,sans-serif;fill:#fff}
      .sub{font:600 17px Inter,Arial,sans-serif;fill:#cbd5e1}
      .k{font:850 24px Inter,Arial,sans-serif;fill:#fff}
      .t{font:650 17px Inter,Arial,sans-serif;fill:#e5e7eb}
      .sm{font:650 14px Inter,Arial,sans-serif;fill:#cbd5e1}
      .card{fill:rgba(15,23,42,.80);stroke:rgba(255,255,255,.18);stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="760" rx="34" fill="url(#bg)"/>
  <text x="58" y="72" class="h">Latihan Esai: Dari Ingatan ke Jawaban</text>
  <text x="60" y="108" class="sub">Setiap soal harus diubah menjadi tesis, konteks, konsep, perbandingan, dan kesimpulan.</text>
  <g filter="url(#sh)">
    <rect x="70" y="180" width="310" height="170" rx="26" class="card"/>
    <text x="110" y="232" class="k">1. Kenali tipe soal</text>
    <text x="110" y="276" class="t">jelaskan, bandingkan, kritik</text>
    <text x="110" y="306" class="sm">jangan langsung menulis panjang</text>
    <rect x="485" y="180" width="310" height="170" rx="26" class="card"/>
    <text x="525" y="232" class="k">2. Ambil jangkar</text>
    <text x="525" y="276" class="t">tokoh, konsep, minggu</text>
    <text x="525" y="306" class="sm">posisikan dalam kronologi</text>
    <rect x="900" y="180" width="310" height="170" rx="26" class="card"/>
    <text x="940" y="232" class="k">3. Tulis struktur</text>
    <text x="940" y="276" class="t">tesis, konteks, konsep</text>
    <text x="940" y="306" class="sm">bandingkan sebelum-sesudah</text>
    <path d="M385 265H475M800 265H890" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/>
    <polygon points="464,245 500,265 464,285" fill="#67e8f9"/>
    <polygon points="879,245 915,265 879,285" fill="#67e8f9"/>
    <rect x="195" y="455" width="890" height="170" rx="28" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
    <text x="255" y="510" class="k">Formula 7-8 kalimat</text>
    <text x="255" y="552" class="t">1 tesis, 2 konteks, 2 konsep, 2 perbandingan, 1 kesimpulan.</text>
    <text x="255" y="588" class="sm">Kalau waktu sempit, prioritaskan alur kronologis dan perbedaan tokoh.</text>
  </g>
</svg>
