<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Peta akhir 20 menit Sejarah Pemikiran Modern</title>
  <desc id="desc">Infografik peta akhir 20 menit berisi urutan tokoh, poros konsep, dan pertanyaan pemicu jawaban.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset=".55" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eef8f4"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#21323a" flood-opacity=".14"/>
    </filter>
    <style>
      .title{font:800 40px Arial,Helvetica,sans-serif;fill:#17262e}
      .sub{font:500 21px Arial,Helvetica,sans-serif;fill:#485a62}
      .panel{fill:#fffef9;stroke:#dae4df;stroke-width:2;rx:24;filter:url(#shadow)}
      .chip{rx:18;stroke-width:0}
      .h{font:800 24px Arial,Helvetica,sans-serif;fill:#17262e}
      .p{font:500 18px Arial,Helvetica,sans-serif;fill:#40525a}
      .mini{font:800 16px Arial,Helvetica,sans-serif;fill:#fff}
      .node{fill:#2c6b64}
      .node2{fill:#d99a32}
      .node3{fill:#b8543c}
      .node4{fill:#425f89}
      .line{stroke:#244149;stroke-width:4;stroke-linecap:round;opacity:.35}
    </style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="70" y="76" class="title">Peta Akhir 20 Menit</text>
  <text x="72" y="114" class="sub">Baca peta ini saat pagi ujian: urutan dulu, lalu rumus pembeda.</text>
  <rect x="74" y="156" width="1132" height="512" class="panel"/>

  <g transform="translate(116 210)">
    <text x="0" y="0" class="h">1. Urutan besar</text>
    <path class="line" d="M8 68H1008"/>
    <g transform="translate(0 44)">
      <circle cx="20" cy="24" r="24" class="node"/><text x="12" y="30" class="mini">1</text>
      <text x="58" y="30" class="p">Yunani dan Abad Tengah</text>
      <circle cx="300" cy="24" r="24" class="node2"/><text x="292" y="30" class="mini">2</text>
      <text x="338" y="30" class="p">Renaissance</text>
      <circle cx="520" cy="24" r="24" class="node3"/><text x="512" y="30" class="mini">3</text>
      <text x="558" y="30" class="p">Rasionalisme dan empirisme</text>
      <circle cx="872" cy="24" r="24" class="node4"/><text x="864" y="30" class="mini">4</text>
      <text x="910" y="30" class="p">Kant</text>
    </g>
    <g transform="translate(0 120)">
      <circle cx="20" cy="24" r="24" class="node"/><text x="12" y="30" class="mini">5</text>
      <text x="58" y="30" class="p">Idealisme dan Hegel</text>
      <circle cx="300" cy="24" r="24" class="node2"/><text x="292" y="30" class="mini">6</text>
      <text x="338" y="30" class="p">Objektivisme</text>
      <circle cx="520" cy="24" r="24" class="node3"/><text x="512" y="30" class="mini">7</text>
      <text x="558" y="30" class="p">Subjektivisme</text>
      <circle cx="760" cy="24" r="24" class="node4"/><text x="752" y="30" class="mini">8</text>
      <text x="798" y="30" class="p">Kontemporer</text>
    </g>
  </g>

  <g transform="translate(116 422)">
    <text x="0" y="0" class="h">2. Rumus pembeda</text>
    <rect x="0" y="34" width="244" height="96" class="chip" fill="#eef8f4"/>
    <text x="22" y="68" class="p">Descartes</text><text x="22" y="100" class="h">dua substansi</text>
    <rect x="270" y="34" width="244" height="96" class="chip" fill="#fff2dd"/>
    <text x="292" y="68" class="p">Spinoza</text><text x="292" y="100" class="h">satu substansi</text>
    <rect x="540" y="34" width="244" height="96" class="chip" fill="#fce9e5"/>
    <text x="562" y="68" class="p">Leibniz</text><text x="562" y="100" class="h">banyak monade</text>
    <rect x="810" y="34" width="244" height="96" class="chip" fill="#eef3ff"/>
    <text x="832" y="68" class="p">Kant</text><text x="832" y="100" class="h">isi dan bentuk</text>
  </g>
  <g transform="translate(116 598)">
    <text x="0" y="0" class="p">Kalimat aman: tokoh X penting karena menjawab masalah Y pada posisi sejarah Z.</text>
  </g>
</svg>
