<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL grammar error spotting scan map</title>
  <desc id="desc">A visual scan order for grammar error spotting: SVA, tense markers, articles, prepositions, pronouns, modifiers, parallelism, comparison, idioms, and No Error discipline.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="46" y="42" width="1108" height="591" rx="28" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
  <text x="78" y="104" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Grammar Error Spotting: Rule Scan</text>
  <text x="80" y="143" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="21">Classify the error family first, then reject options by rule lock.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="80" y="190" width="190" height="104" rx="16" fill="#164e63"/>
    <text x="106" y="230" fill="#ecfeff" font-size="24" font-weight="750">SVA Lock</text>
    <text x="106" y="260" fill="#cffafe" font-size="19">Subject + verb</text>

    <rect x="302" y="190" width="190" height="104" rx="16" fill="#365314"/>
    <text x="328" y="230" fill="#f7fee7" font-size="24" font-weight="750">Tense</text>
    <text x="328" y="260" fill="#dcfce7" font-size="19">Marker words</text>

    <rect x="524" y="190" width="190" height="104" rx="16" fill="#7c2d12"/>
    <text x="550" y="230" fill="#fff7ed" font-size="24" font-weight="750">Articles</text>
    <text x="550" y="260" fill="#ffedd5" font-size="19">a / an / the</text>

    <rect x="746" y="190" width="190" height="104" rx="16" fill="#1d4ed8"/>
    <text x="772" y="230" fill="#eff6ff" font-size="24" font-weight="750">Pronouns</text>
    <text x="772" y="260" fill="#dbeafe" font-size="19">case + owner</text>

    <rect x="968" y="190" width="150" height="104" rx="16" fill="#581c87"/>
    <text x="994" y="230" fill="#faf5ff" font-size="24" font-weight="750">No Error</text>
    <text x="994" y="260" fill="#f3e8ff" font-size="19">discipline</text>

    <path d="M274 242h24" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <path d="M496 242h24" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <path d="M718 242h24" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <path d="M940 242h24" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <path d="M290 232l13 10-13 10" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M512 232l13 10-13 10" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M734 232l13 10-13 10" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M956 232l13 10-13 10" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="82" y="362" width="318" height="180" rx="18" fill="#1f2937" stroke="#64748b" stroke-width="2"/>
    <text x="112" y="406" fill="#f8fafc" font-size="25" font-weight="750">Rule Families</text>
    <text x="112" y="444" fill="#bae6fd" font-size="20">Preposition and idiom</text>
    <text x="112" y="474" fill="#bae6fd" font-size="20">Modifier placement</text>
    <text x="112" y="504" fill="#bae6fd" font-size="20">Parallel structure</text>

    <rect x="442" y="362" width="318" height="180" rx="18" fill="#1f2937" stroke="#64748b" stroke-width="2"/>
    <text x="472" y="406" fill="#f8fafc" font-size="25" font-weight="750">Trap Radar</text>
    <text x="472" y="444" fill="#fecaca" font-size="20">Intervening phrase</text>
    <text x="472" y="474" fill="#fecaca" font-size="20">since / for misuse</text>
    <text x="472" y="504" fill="#fecaca" font-size="20">one of those who</text>

    <rect x="802" y="362" width="316" height="180" rx="18" fill="#1f2937" stroke="#64748b" stroke-width="2"/>
    <text x="832" y="406" fill="#f8fafc" font-size="25" font-weight="750">Option Decision</text>
    <text x="832" y="444" fill="#ddd6fe" font-size="20">Find exact part</text>
    <text x="832" y="474" fill="#ddd6fe" font-size="20">Do not invent errors</text>
  <text x="832" y="504" fill="#ddd6fe" font-size="20">Verify the exact error</text>
  </g>
</svg>
