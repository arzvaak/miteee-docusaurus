<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">HCF and LCM decision map</title>
  <desc id="desc">A study map for choosing HCF, LCM, product relation, fraction relation, and remainder-difference routes in SSC CGL Quant.</desc>
  <rect width="960" height="520" fill="#f7fbf8"/>
  <rect x="44" y="38" width="872" height="84" rx="18" fill="#163f38"/>
  <text x="480" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">HCF and LCM</text>
  <text x="480" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#d7eee7">Classify the wording first, then choose the shortest exact route</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1f2d29">
    <rect x="70" y="172" width="220" height="88" rx="14" fill="#e8f4ef" stroke="#8fb9aa"/>
    <text x="180" y="204" text-anchor="middle" font-weight="700">Greatest divisor?</text>
    <text x="180" y="232" text-anchor="middle">Use HCF or Euclid</text>
    <rect x="370" y="172" width="220" height="88" rx="14" fill="#fff4dc" stroke="#d1a44a"/>
    <text x="480" y="204" text-anchor="middle" font-weight="700">Least multiple?</text>
    <text x="480" y="232" text-anchor="middle">Use LCM prime powers</text>
    <rect x="670" y="172" width="220" height="88" rx="14" fill="#f4e9ff" stroke="#b896dc"/>
    <text x="780" y="204" text-anchor="middle" font-weight="700">Same remainder?</text>
    <text x="780" y="232" text-anchor="middle">Take differences first</text>
    <rect x="145" y="330" width="260" height="96" rx="14" fill="#edf6ff" stroke="#8aaed0"/>
    <text x="275" y="362" text-anchor="middle" font-weight="700">Two-number relation</text>
    <text x="275" y="390" text-anchor="middle">Product = HCF x LCM</text>
    <rect x="555" y="330" width="260" height="96" rx="14" fill="#fceeee" stroke="#d8a0a0"/>
    <text x="685" y="362" text-anchor="middle" font-weight="700">Fraction relation</text>
    <text x="685" y="390" text-anchor="middle">Swap numerator/denominator rules</text>
  </g>
  <g stroke="#5f756e" stroke-width="3" fill="none">
    <path d="M180 260 C205 302 225 314 275 330"/>
    <path d="M480 260 C450 300 380 306 275 330"/>
    <path d="M480 260 C525 302 590 310 685 330"/>
    <path d="M780 260 C760 302 735 314 685 330"/>
  </g>
  <text x="480" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#163f38">Identify divisor, multiple, or remainder wording before calculating.</text>
</svg>
