<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL Time Speed Distance decision map</title>
  <desc id="desc">A compact map for classifying time speed distance questions into basic formula, average speed, train crossing, boat-stream, race, and circular track types.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="48" y="40" width="1104" height="92" rx="18" fill="#0f172a"/>
  <text x="82" y="88" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Time-Speed-Distance Decision Map</text>
  <text x="82" y="118" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Classify first, align units, then calculate. Most misses are model-selection errors.</text>

  <g font-family="Arial, sans-serif">
    <rect x="60" y="172" width="330" height="182" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="88" y="210" font-size="24" font-weight="700" fill="#0f172a">Basic D/S/T</text>
    <text x="88" y="248" font-size="18" fill="#1e293b">D = S x T</text>
    <text x="88" y="278" font-size="18" fill="#1e293b">km/h to m/s: x 5/18</text>
    <text x="88" y="308" font-size="18" fill="#1e293b">m/s to km/h: x 18/5</text>

    <rect x="435" y="172" width="330" height="182" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="463" y="210" font-size="24" font-weight="700" fill="#0f172a">Average Speed</text>
    <text x="463" y="248" font-size="18" fill="#1e293b">Equal distance: 2uv/(u+v)</text>
    <text x="463" y="278" font-size="18" fill="#1e293b">Equal time: (u+v)/2</text>
    <text x="463" y="308" font-size="18" fill="#1e293b">Unequal parts: total D / total T</text>

    <rect x="810" y="172" width="330" height="182" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="838" y="210" font-size="24" font-weight="700" fill="#0f172a">Train Crossing</text>
    <text x="838" y="248" font-size="18" fill="#1e293b">Pole: train length</text>
    <text x="838" y="278" font-size="18" fill="#1e293b">Platform: train + platform</text>
    <text x="838" y="308" font-size="18" fill="#1e293b">Two trains: sum lengths</text>

    <rect x="60" y="420" width="330" height="182" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="88" y="458" font-size="24" font-weight="700" fill="#0f172a">Relative Speed</text>
    <text x="88" y="496" font-size="18" fill="#1e293b">Opposite: add speeds</text>
    <text x="88" y="526" font-size="18" fill="#1e293b">Same direction: subtract</text>
    <text x="88" y="556" font-size="18" fill="#1e293b">Overtake: faster - slower</text>

    <rect x="435" y="420" width="330" height="182" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="463" y="458" font-size="24" font-weight="700" fill="#0f172a">Boat-Stream</text>
    <text x="463" y="496" font-size="18" fill="#1e293b">Downstream = boat + stream</text>
    <text x="463" y="526" font-size="18" fill="#1e293b">Upstream = boat - stream</text>
    <text x="463" y="556" font-size="18" fill="#1e293b">Boat = (D+U)/2, stream = (D-U)/2</text>

    <rect x="810" y="420" width="330" height="182" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
    <text x="838" y="458" font-size="24" font-weight="700" fill="#0f172a">Race / Circular</text>
    <text x="838" y="496" font-size="18" fill="#1e293b">Race: same-time distance ratio</text>
    <text x="838" y="526" font-size="18" fill="#1e293b">Head start: lead / relative speed</text>
    <text x="838" y="556" font-size="18" fill="#1e293b">Circular: circumference / relative speed</text>
  </g>

  <path d="M390 263 C412 263 412 263 435 263" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M765 263 C788 263 788 263 810 263" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M225 354 C225 385 225 385 225 420" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 354 C600 385 600 385 600 420" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M975 354 C975 385 975 385 975 420" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
</svg>
