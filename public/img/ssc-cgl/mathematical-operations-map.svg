<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL mathematical operations decision map</title>
  <desc id="desc">A 157-question mathematical operations map for symbol substitution, operator interchange, coded operations, BODMAS and equation verification.</desc>
  <rect width="960" height="540" fill="#101820"/>
  <rect x="28" y="28" width="904" height="484" rx="18" fill="#172235" stroke="#a7f3d0" stroke-width="2"/>
  <text x="480" y="68" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Mathematical Operations 157-Q Map</text>
  <text x="480" y="100" text-anchor="middle" fill="#d1fae5" font-family="Inter, Arial, sans-serif" font-size="15">Classify first, rewrite symbols, apply BODMAS, then verify equality before marking.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="15">
    <rect x="58" y="132" width="250" height="118" rx="12" fill="#d1fae5"/>
    <text x="183" y="160" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">5-Second Type Lock</text>
    <text x="80" y="192" fill="#0f172a">symbol substitution</text>
    <text x="80" y="217" fill="#0f172a">operator interchange</text>
    <text x="80" y="242" fill="#0f172a">coded operation</text>

    <rect x="355" y="132" width="250" height="118" rx="12" fill="#dbeafe"/>
    <text x="480" y="160" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Rewrite Before Math</text>
    <text x="377" y="192" fill="#0f172a">draw two-row map</text>
    <text x="377" y="217" fill="#0f172a">swap every occurrence</text>
    <text x="377" y="242" fill="#0f172a">write formula once</text>

    <rect x="652" y="132" width="250" height="118" rx="12" fill="#fef3c7"/>
    <text x="777" y="160" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">BODMAS Gate</text>
    <text x="674" y="192" fill="#0f172a">brackets first</text>
    <text x="674" y="217" fill="#0f172a">divide/multiply left to right</text>
    <text x="674" y="242" fill="#0f172a">keep negative sign</text>

    <rect x="58" y="315" width="250" height="118" rx="12" fill="#fee2e2"/>
    <text x="183" y="343" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Option Testing</text>
    <text x="80" y="375" fill="#0f172a">test sign pairs in order</text>
    <text x="80" y="400" fill="#0f172a">stop only when equality holds</text>
    <text x="80" y="425" fill="#0f172a">use rough work for swaps</text>

    <rect x="355" y="315" width="250" height="118" rx="12" fill="#ede9fe"/>
    <text x="480" y="343" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">36-Second Plan</text>
    <text x="377" y="375" fill="#0f172a">0-5s classify</text>
    <text x="377" y="400" fill="#0f172a">5-25s solve</text>
    <text x="377" y="425" fill="#0f172a">25-36s verify or skip</text>

    <rect x="652" y="315" width="250" height="118" rx="12" fill="#cffafe"/>
    <text x="777" y="343" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Repair Loop</text>
    <text x="674" y="375" fill="#0f172a">tag map, BODMAS, sign</text>
    <text x="674" y="400" fill="#0f172a">redo same type twice</text>
    <text x="674" y="425" fill="#0f172a">promote only under timer</text>
  </g>

  <g stroke="#a7f3d0" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M308 190 H355"/>
    <path d="M605 190 H652"/>
    <path d="M777 250 V315"/>
    <path d="M652 374 H605"/>
    <path d="M355 374 H308"/>
    <path d="M183 315 V250"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a7f3d0"/>
    </marker>
  </defs>
</svg>
