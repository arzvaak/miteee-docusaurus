<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL Algebra decision map</title>
  <desc id="desc">A compact visual showing how to classify algebra questions into identities, linear systems, quadratics, polynomials, inequalities, and sequence routes.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="42" y="36" width="1116" height="688" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="74" y="88" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Algebra: Recognise, Transform, Verify</text>
  <text x="76" y="122" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Recognise the expression family before expanding, and preserve every domain or sign condition.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="78" y="164" width="270" height="110" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="102" y="199" font-size="22" font-weight="800" fill="#0c4a6e">Identity Trigger</text>
    <text x="102" y="230" font-size="17" fill="#075985">(a+b)^2, (a-b)^2</text>
    <text x="102" y="254" font-size="17" fill="#075985">cube, difference of squares</text>

    <rect x="466" y="164" width="270" height="110" rx="10" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
    <text x="490" y="199" font-size="22" font-weight="800" fill="#365314">Linear-System Trigger</text>
    <text x="490" y="230" font-size="17" fill="#3f6212">isolate, substitute, eliminate</text>
    <text x="490" y="254" font-size="17" fill="#3f6212">detect same or parallel lines</text>

    <rect x="854" y="164" width="270" height="110" rx="10" fill="#fae8ff" stroke="#86198f" stroke-width="2"/>
    <text x="878" y="199" font-size="22" font-weight="800" fill="#701a75">Quadratic Trigger</text>
    <text x="878" y="230" font-size="17" fill="#86198f">factor or use the formula</text>
    <text x="878" y="254" font-size="17" fill="#86198f">check discriminant and roots</text>

    <path d="M214 274 L214 332" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M602 274 L602 332" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M990 274 L990 332" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="78" y="332" width="270" height="132" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="102" y="367" font-size="21" font-weight="800" fill="#075985">Write Formula First</text>
    <text x="102" y="399" font-size="16" fill="#0c4a6e">Sum-square: S^2 - 2P</text>
    <text x="102" y="423" font-size="16" fill="#0c4a6e">Diff-square: D^2 + 2P</text>
    <text x="102" y="447" font-size="16" fill="#0c4a6e">Cube: S^3 - 3PS</text>

    <rect x="466" y="332" width="270" height="132" rx="10" fill="#f7fee7" stroke="#65a30d" stroke-width="2"/>
    <text x="490" y="367" font-size="21" font-weight="800" fill="#3f6212">Preserve Equality</text>
    <text x="490" y="399" font-size="16" fill="#365314">clear denominators with an LCM</text>
    <text x="490" y="423" font-size="16" fill="#365314">record excluded values first</text>
    <text x="490" y="447" font-size="16" fill="#365314">check candidates in the original</text>

    <rect x="854" y="332" width="270" height="132" rx="10" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
    <text x="878" y="367" font-size="21" font-weight="800" fill="#86198f">Polynomial and Sequence</text>
    <text x="878" y="399" font-size="16" fill="#701a75">remainder at x = a is P(a)</text>
    <text x="878" y="423" font-size="16" fill="#701a75">factor when P(a) = 0</text>
    <text x="878" y="447" font-size="16" fill="#701a75">AP: term first, then sum</text>

    <rect x="116" y="548" width="970" height="82" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="150" y="584" font-size="22" font-weight="800" fill="#9a3412">Final Domain and Sign Check</text>
  <text x="150" y="615" font-size="17" fill="#9a3412">Check coefficients, excluded values, extraneous roots, inequality direction, and the exact form requested.</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
