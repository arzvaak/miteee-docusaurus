<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL synonyms antonyms 36-second vocabulary map</title>
  <desc id="desc">A visual map for solving SSC CGL synonyms and antonyms through part of speech, meaning, connotation, degree, roots, and context.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="42" y="36" width="1116" height="688" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="74" y="88" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">Synonyms and Antonyms: 36-Second Filter</text>
  <text x="76" y="122" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Do not guess from word shape alone. Filter by part of speech, meaning, tone, degree, and context.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="78" y="160" width="210" height="120" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="104" y="198" font-size="22" font-weight="800" fill="#1e3a8a">POS Gate</text>
    <text x="104" y="230" font-size="16" fill="#1d4ed8">noun, verb, adjective</text>
    <text x="104" y="254" font-size="16" fill="#1d4ed8">adverb, phrase usage</text>

    <rect x="354" y="160" width="210" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="380" y="198" font-size="22" font-weight="800" fill="#14532d">Meaning Gate</text>
    <text x="380" y="230" font-size="16" fill="#166534">synonym = nearest</text>
    <text x="380" y="254" font-size="16" fill="#166534">antonym = true opposite</text>

    <rect x="630" y="160" width="210" height="120" rx="10" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text x="656" y="198" font-size="22" font-weight="800" fill="#831843">Tone Gate</text>
    <text x="656" y="230" font-size="16" fill="#9d174d">positive, neutral</text>
    <text x="656" y="254" font-size="16" fill="#9d174d">negative, formal</text>

    <rect x="906" y="160" width="210" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="932" y="198" font-size="22" font-weight="800" fill="#92400e">Decode Gate</text>
    <text x="932" y="230" font-size="16" fill="#b45309">root, prefix, suffix</text>
    <text x="932" y="254" font-size="16" fill="#b45309">context replacement</text>

    <path d="M183 280 L183 340" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M459 280 L459 340" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M735 280 L735 340" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1011 280 L1011 340" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="78" y="340" width="210" height="142" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="104" y="376" font-size="19" font-weight="800" fill="#1e40af">Wrong POS Dies</text>
    <text x="104" y="408" font-size="15" fill="#1d4ed8">decisive != decision</text>
    <text x="104" y="432" font-size="15" fill="#1d4ed8">bravery = courage</text>
    <text x="104" y="456" font-size="15" fill="#1d4ed8">quickly = swiftly</text>

    <rect x="354" y="340" width="210" height="142" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="376" font-size="19" font-weight="800" fill="#166534">Near Meaning</text>
    <text x="380" y="408" font-size="15" fill="#15803d">concise = brief</text>
    <text x="380" y="432" font-size="15" fill="#15803d">exacerbate = worsen</text>
    <text x="380" y="456" font-size="15" fill="#15803d">ephemeral = temporary</text>

    <rect x="630" y="340" width="210" height="142" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="656" y="376" font-size="19" font-weight="800" fill="#9d174d">Tone Match</text>
    <text x="656" y="408" font-size="15" fill="#be185d">frugal != stingy</text>
    <text x="656" y="432" font-size="15" fill="#be185d">confident != arrogant</text>
    <text x="656" y="456" font-size="15" fill="#be185d">obstinate = negative</text>

    <rect x="906" y="340" width="210" height="142" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="932" y="376" font-size="19" font-weight="800" fill="#92400e">Root Decode</text>
    <text x="932" y="408" font-size="15" fill="#b45309">bene = good</text>
    <text x="932" y="432" font-size="15" fill="#b45309">mal = bad</text>
    <text x="932" y="456" font-size="15" fill="#b45309">equi = equal</text>

    <rect x="116" y="560" width="970" height="82" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="150" y="596" font-size="22" font-weight="800" fill="#0f172a">Final Marking Rule</text>
    <text x="150" y="627" font-size="17" fill="#334155">Attempt when two options can be eliminated. Skip when all four remain equally unknown under negative marking.</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
</svg>
