<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL Art and Culture Recall Map</title>
  <desc id="desc">A compact map for art and culture memory pairs: dance, literature, monuments, paintings, music, festivals, and traps.</desc>
  <rect width="1280" height="720" fill="#f7fbff"/>
  <rect x="56" y="52" width="1168" height="616" rx="24" fill="#ffffff" stroke="#c9d8e8" stroke-width="3"/>
  <text x="94" y="116" fill="#18334d" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">SSC CGL Art &amp; Culture Pair Map</text>
  <text x="94" y="156" fill="#52677c" font-family="Inter, Arial, sans-serif" font-size="22">One question usually asks one pair. Lock the pair type first, then recall state, author, dynasty, field, or trap.</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(94 210)">
      <rect width="330" height="126" rx="16" fill="#eaf4ff" stroke="#9cc5eb" stroke-width="2"/>
      <text x="24" y="42" fill="#17476f" font-size="25" font-weight="800">Dance + State</text>
      <text x="24" y="76" fill="#425c72" font-size="18">Classical 8 first</text>
      <text x="24" y="104" fill="#425c72" font-size="18">Then folk: Bihu, Garba, Ghoomar</text>
    </g>
    <g transform="translate(474 210)">
      <rect width="330" height="126" rx="16" fill="#fff3df" stroke="#e5b56d" stroke-width="2"/>
      <text x="24" y="42" fill="#765016" font-size="25" font-weight="800">Author + Work</text>
      <text x="24" y="76" fill="#6c5b40" font-size="18">Valmiki, Vyasa, Kalhana</text>
      <text x="24" y="104" fill="#6c5b40" font-size="18">Tagore, Bankim, Premchand</text>
    </g>
    <g transform="translate(854 210)">
      <rect width="330" height="126" rx="16" fill="#edf8ed" stroke="#93ca93" stroke-width="2"/>
      <text x="24" y="42" fill="#28612f" font-size="25" font-weight="800">Monument + Builder</text>
      <text x="24" y="76" fill="#436445" font-size="18">Mughal, Chola, Rashtrakuta</text>
      <text x="24" y="104" fill="#436445" font-size="18">Started, completed, repaired</text>
    </g>

    <g transform="translate(94 390)">
      <rect width="330" height="126" rx="16" fill="#f1edff" stroke="#b9a6ee" stroke-width="2"/>
      <text x="24" y="42" fill="#4e3680" font-size="25" font-weight="800">Painting + Region</text>
      <text x="24" y="76" fill="#5c5272" font-size="18">Madhubani, Warli, Pattachitra</text>
      <text x="24" y="104" fill="#5c5272" font-size="18">Tanjore, Kangra, Kalamkari</text>
    </g>
    <g transform="translate(474 390)">
      <rect width="330" height="126" rx="16" fill="#ffeef1" stroke="#eba2af" stroke-width="2"/>
      <text x="24" y="42" fill="#7c3341" font-size="25" font-weight="800">Music + Instrument</text>
      <text x="24" y="76" fill="#704d54" font-size="18">Ravi Shankar: Sitar</text>
      <text x="24" y="104" fill="#704d54" font-size="18">Bismillah Khan: Shehnai</text>
    </g>
    <g transform="translate(854 390)">
      <rect width="330" height="126" rx="16" fill="#eaf9f7" stroke="#81cfc4" stroke-width="2"/>
      <text x="24" y="42" fill="#1d6a63" font-size="25" font-weight="800">Festival / GI + State</text>
      <text x="24" y="76" fill="#42635f" font-size="18">Pongal, Onam, Baisakhi</text>
      <text x="24" y="104" fill="#42635f" font-size="18">Kancheepuram, Pashmina</text>
    </g>
  </g>

  <path d="M244 336v42M624 336v42M1004 336v42" stroke="#8094a8" stroke-width="3" stroke-linecap="round"/>
  <rect x="312" y="570" width="656" height="52" rx="26" fill="#18334d"/>
  <text x="640" y="604" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Exam rule: pair type -> exact association -> trap check -> answer</text>
</svg>
