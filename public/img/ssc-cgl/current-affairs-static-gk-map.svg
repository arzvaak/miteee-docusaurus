<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL current affairs to static GK conversion map</title>
  <desc id="desc">A compact map showing how daily news becomes SSC-ready static GK recall and MCQ practice.</desc>
  <rect width="960" height="540" fill="#10151f"/>
  <rect x="28" y="28" width="904" height="484" rx="20" fill="#172235" stroke="#fde68a" stroke-width="2"/>
  <text x="480" y="70" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Current Affairs to Static GK Map</text>
  <text x="480" y="100" text-anchor="middle" fill="#d1d5db" font-family="Inter, Arial, sans-serif" font-size="15">Live brief -> official source -> dated fact -> static anchor -> mixed practice</text>

  <g font-family="Inter, Arial, sans-serif" font-size="15">
    <rect x="60" y="135" width="250" height="118" rx="14" fill="#fef3c7"/>
    <text x="185" y="163" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Daily Source</text>
    <text x="82" y="195" fill="#0f172a">Person, scheme, report</text>
    <text x="82" y="220" fill="#0f172a">Place, date, award, summit</text>
    <text x="82" y="245" fill="#0f172a">Source: PIB, RBI, PRS, SSC</text>

    <rect x="355" y="135" width="250" height="118" rx="14" fill="#e0f2fe"/>
    <text x="480" y="163" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Static Anchor</text>
    <text x="377" y="195" fill="#0f172a">Ministry, article, body</text>
    <text x="377" y="220" fill="#0f172a">Publisher, HQ, convention</text>
    <text x="377" y="245" fill="#0f172a">Map, river, park, institution</text>

    <rect x="650" y="135" width="250" height="118" rx="14" fill="#dcfce7"/>
    <text x="775" y="163" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">SSC Fact Unit</text>
    <text x="672" y="195" fill="#0f172a">Entity + attribute</text>
    <text x="672" y="220" fill="#0f172a">Anchor + trap</text>
    <text x="672" y="245" fill="#0f172a">Memory hook + MCQ seed</text>

    <rect x="60" y="320" width="250" height="115" rx="14" fill="#fee2e2"/>
    <text x="185" y="348" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Trap Filter</text>
    <text x="82" y="380" fill="#0f172a">Old vs latest holder</text>
    <text x="82" y="405" fill="#0f172a">Ministry/publisher swap</text>
    <text x="82" y="430" fill="#0f172a">Rank, year, venue reversal</text>

    <rect x="355" y="320" width="250" height="115" rx="14" fill="#f5f3ff"/>
    <text x="480" y="348" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Source Classifier</text>
    <text x="377" y="380" fill="#0f172a">Scheme -> ministry</text>
    <text x="377" y="405" fill="#0f172a">Report -> publisher</text>
    <text x="377" y="430" fill="#0f172a">Notice -> date/action</text>

    <rect x="650" y="320" width="250" height="115" rx="14" fill="#ecfeff"/>
    <text x="775" y="348" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Practice Route</text>
    <text x="672" y="380" fill="#0f172a">Live current-affairs brief</text>
    <text x="672" y="405" fill="#0f172a">Static-GK topic lesson</text>
    <text x="672" y="430" fill="#0f172a">Focused and mixed practice</text>
  </g>

  <g stroke="#fde68a" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M310 194 H355"/>
    <path d="M605 194 H650"/>
    <path d="M775 253 V320"/>
    <path d="M650 377 H605"/>
    <path d="M355 377 H310"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fde68a"/>
    </marker>
  </defs>
</svg>
