<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL percentages 36-second base map</title>
  <desc id="desc">A 381-question percentages map showing base selection, fraction conversion, multiplier choice, option-gap computation and repair.</desc>
  <rect width="960" height="540" fill="#101820"/>
  <rect x="28" y="28" width="904" height="484" rx="18" fill="#172235" stroke="#fbbf24" stroke-width="2"/>
  <text x="480" y="68" text-anchor="middle" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Percentages 381-Q Base Map</text>
  <text x="480" y="100" text-anchor="middle" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="15">Lock the base first; then choose fraction, multiplier, approximation, or reverse percentage.</text>

  <g font-family="Inter, Arial, sans-serif" font-size="15">
    <rect x="55" y="132" width="250" height="118" rx="12" fill="#fef3c7"/>
    <text x="180" y="160" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">1. Wording Lock</text>
    <text x="78" y="192" fill="#0f172a">from = old base</text>
    <text x="78" y="217" fill="#0f172a">than = compared base</text>
    <text x="78" y="242" fill="#0f172a">valid votes = real base</text>

    <rect x="355" y="132" width="250" height="118" rx="12" fill="#dcfce7"/>
    <text x="480" y="160" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">2. Fast Form</text>
    <text x="378" y="192" fill="#0f172a">fraction conversion</text>
    <text x="378" y="217" fill="#0f172a">1 +/- p/100 multiplier</text>
    <text x="378" y="242" fill="#0f172a">100 model for comparison</text>

    <rect x="655" y="132" width="250" height="118" rx="12" fill="#dbeafe"/>
    <text x="780" y="160" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">3. Compute Only Needed</text>
    <text x="678" y="192" fill="#0f172a">cancel before multiplying</text>
    <text x="678" y="217" fill="#0f172a">use option gap</text>
    <text x="678" y="242" fill="#0f172a">avoid long decimal work</text>

    <rect x="55" y="315" width="250" height="118" rx="12" fill="#fee2e2"/>
    <text x="180" y="343" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Trap Families</text>
    <text x="78" y="375" fill="#0f172a">successive change</text>
    <text x="78" y="400" fill="#0f172a">percentage points</text>
    <text x="78" y="425" fill="#0f172a">area and volume factors</text>

    <rect x="355" y="315" width="250" height="118" rx="12" fill="#ede9fe"/>
    <text x="480" y="343" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">36-Second Check</text>
    <text x="378" y="375" fill="#0f172a">0-8s identify base</text>
    <text x="378" y="400" fill="#0f172a">8-28s calculate route</text>
    <text x="378" y="425" fill="#0f172a">28-36s verify wording</text>

    <rect x="655" y="315" width="250" height="118" rx="12" fill="#cffafe"/>
    <text x="780" y="343" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="700">Repair Queue</text>
    <text x="678" y="375" fill="#0f172a">tag base, conversion, SI/CI</text>
    <text x="678" y="400" fill="#0f172a">redo same family twice</text>
    <text x="678" y="425" fill="#0f172a">promote only under timer</text>
  </g>

  <g stroke="#fbbf24" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M305 190 H355"/>
    <path d="M605 190 H655"/>
    <path d="M780 250 V315"/>
    <path d="M655 374 H605"/>
    <path d="M355 374 H305"/>
    <path d="M180 315 V250"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
  </defs>
</svg>
