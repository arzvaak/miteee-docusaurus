<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL time work pipes decision map</title>
  <desc id="desc">A decision map for time, work, efficiency, wages, and pipes questions.</desc>
  <rect width="1200" height="760" fill="#08111f"/>
  <rect x="42" y="38" width="1116" height="684" rx="18" fill="#101c2b" stroke="#7dd3fc" stroke-width="3"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fbff">Time, Work, Pipes: Rate Engine</text>
  <text x="600" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#c5d4e8">Classify the cue, choose total work, combine signed rates, then check the unit</text>

  <g font-family="Arial, sans-serif">
    <rect x="78" y="158" width="310" height="156" rx="14" fill="#162a3f" stroke="#60a5fa" stroke-width="2"/>
    <text x="233" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Basic Work</text>
    <text x="104" y="225" font-size="17" fill="#e5f1ff">Cue: alone, together, days</text>
    <text x="104" y="253" font-size="17" fill="#e5f1ff">LCM = total work</text>
    <text x="104" y="281" font-size="17" fill="#e5f1ff">Rate = work / time</text>

    <rect x="445" y="158" width="310" height="156" rx="14" fill="#162a3f" stroke="#facc15" stroke-width="2"/>
    <text x="600" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Efficiency</text>
    <text x="471" y="225" font-size="17" fill="#fff7d6">Cue: twice, 25% more</text>
    <text x="471" y="253" font-size="17" fill="#fff7d6">Use rate ratio first</text>
    <text x="471" y="281" font-size="17" fill="#fff7d6">Invert only for time</text>

    <rect x="812" y="158" width="310" height="156" rx="14" fill="#162a3f" stroke="#34d399" stroke-width="2"/>
    <text x="967" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Men-Days-Hours</text>
    <text x="838" y="225" font-size="17" fill="#dcfce7">Cue: men, hours, days</text>
    <text x="838" y="253" font-size="17" fill="#dcfce7">Work = M x D x H</text>
    <text x="838" y="281" font-size="17" fill="#dcfce7">Use only for equal efficiency</text>

    <rect x="78" y="365" width="310" height="156" rx="14" fill="#162a3f" stroke="#fb7185" stroke-width="2"/>
    <text x="233" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Pipes + Leaks</text>
    <text x="104" y="432" font-size="17" fill="#ffe4e6">Inlet = positive rate</text>
    <text x="104" y="460" font-size="17" fill="#ffe4e6">Outlet/leak = negative rate</text>
    <text x="104" y="488" font-size="17" fill="#ffe4e6">Time = remaining / net rate</text>

    <rect x="445" y="365" width="310" height="156" rx="14" fill="#162a3f" stroke="#c084fc" stroke-width="2"/>
    <text x="600" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Phase Changes</text>
    <text x="471" y="432" font-size="17" fill="#f3e8ff">Cue: leaves, joins, after</text>
    <text x="471" y="460" font-size="17" fill="#f3e8ff">Checkpoint completed work</text>
    <text x="471" y="488" font-size="17" fill="#f3e8ff">New rate for remaining work</text>

    <rect x="812" y="365" width="310" height="156" rx="14" fill="#162a3f" stroke="#fb923c" stroke-width="2"/>
    <text x="967" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Alternate + Wages</text>
    <text x="838" y="432" font-size="17" fill="#ffedd5">Cycle output + remainder</text>
    <text x="838" y="460" font-size="17" fill="#ffedd5">Check who starts</text>
    <text x="838" y="488" font-size="17" fill="#ffedd5">Wages = rate x time share</text>

    <rect x="196" y="596" width="808" height="66" rx="33" fill="#7dd3fc"/>
    <text x="600" y="637" text-anchor="middle" font-size="22" font-weight="700" fill="#07111e">Solve loop: cue -> total work -> signed rates -> remaining work -> unit check</text>
  </g>
</svg>
