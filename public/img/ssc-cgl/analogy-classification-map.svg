<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Analogy and classification exact-relation concept map</title>
  <desc id="desc">A study map grouping word, number, letter, and classification questions around a five-step process: classify, state the exact rule, apply it, verify it, and then mark or move.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0 0 L8 3.5 L0 7 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="url(#page)"/>
  <rect x="24" y="22" width="912" height="476" rx="24" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="480" y="60" text-anchor="middle" fill="#0f172a" font-size="28" font-weight="700">Analogy and Classification</text>
    <text x="480" y="88" text-anchor="middle" fill="#475569" font-size="16">Name the exact relation before you search for the answer.</text>

    <g filter="url(#shadow)">
      <rect x="58" y="116" width="256" height="158" rx="16" fill="#ecfdf5" stroke="#6ee7b7"/>
      <rect x="352" y="116" width="256" height="158" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
      <rect x="646" y="116" width="256" height="158" rx="16" fill="#fff7ed" stroke="#fdba74"/>
    </g>

    <text x="186" y="148" text-anchor="middle" fill="#065f46" font-size="20" font-weight="700">Word relations</text>
    <text x="78" y="179" fill="#1e293b" font-size="15">• Turn the pair into a sentence</text>
    <text x="78" y="205" fill="#1e293b" font-size="15">• Tool → action; part → whole</text>
    <text x="78" y="231" fill="#1e293b" font-size="15">• Member → class; producer → product</text>
    <text x="78" y="257" fill="#1e293b" font-size="15">• Preserve meaning and direction</text>

    <text x="480" y="148" text-anchor="middle" fill="#1d4ed8" font-size="20" font-weight="700">Number relations</text>
    <text x="372" y="179" fill="#1e293b" font-size="15">• Test square and cube first</text>
    <text x="372" y="205" fill="#1e293b" font-size="15">• Then scale, offset, and digits</text>
    <text x="372" y="231" fill="#1e293b" font-size="15">• Prefer the simplest complete rule</text>
    <text x="372" y="257" fill="#1e293b" font-size="15">• Verify it on the given pair</text>

    <text x="774" y="148" text-anchor="middle" fill="#9a3412" font-size="20" font-weight="700">Letter relations</text>
    <text x="666" y="179" fill="#1e293b" font-size="15">• Convert letters to positions</text>
    <text x="666" y="205" fill="#1e293b" font-size="15">• Check every shift, not only one</text>
    <text x="666" y="231" fill="#1e293b" font-size="15">• Test reverse, opposite, and gaps</text>
    <text x="666" y="257" fill="#1e293b" font-size="15">• Preserve order and direction</text>

    <g filter="url(#shadow)">
      <rect x="58" y="316" width="256" height="142" rx="16" fill="#fdf2f8" stroke="#f9a8d4"/>
      <rect x="352" y="302" width="550" height="170" rx="16" fill="#f8fafc" stroke="#94a3b8"/>
    </g>

    <text x="186" y="348" text-anchor="middle" fill="#9d174d" font-size="20" font-weight="700">Classification</text>
    <text x="78" y="379" fill="#1e293b" font-size="15">• Find one exact rule shared by three</text>
    <text x="78" y="405" fill="#1e293b" font-size="15">• Reject labels that fit all four</text>
    <text x="78" y="431" fill="#1e293b" font-size="15">• Confirm a unique exception</text>

    <text x="627" y="335" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">36-second decision loop</text>
    <text x="627" y="358" text-anchor="middle" fill="#475569" font-size="14">The clock is a ceiling: finish direct questions sooner.</text>

    <g font-size="13" text-anchor="middle">
      <rect x="373" y="384" width="88" height="54" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
      <text x="417" y="405" fill="#0c4a6e" font-weight="700">Classify</text>
      <text x="417" y="424" fill="#334155">0–5 s</text>

      <rect x="478" y="384" width="88" height="54" rx="10" fill="#dcfce7" stroke="#86efac"/>
      <text x="522" y="405" fill="#14532d" font-weight="700">State rule</text>
      <text x="522" y="424" fill="#334155">5–14 s</text>

      <rect x="583" y="384" width="88" height="54" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="627" y="405" fill="#713f12" font-weight="700">Apply</text>
      <text x="627" y="424" fill="#334155">14–26 s</text>

      <rect x="688" y="384" width="88" height="54" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
      <text x="732" y="405" fill="#4c1d95" font-weight="700">Verify</text>
      <text x="732" y="424" fill="#334155">26–32 s</text>

      <rect x="793" y="384" width="88" height="54" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="837" y="405" fill="#7f1d1d" font-weight="700">Mark / move</text>
      <text x="837" y="424" fill="#334155">32–36 s</text>
    </g>

    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M461 411 H475"/>
      <path d="M566 411 H580"/>
      <path d="M671 411 H685"/>
      <path d="M776 411 H790"/>
    </g>
  </g>
</svg>
