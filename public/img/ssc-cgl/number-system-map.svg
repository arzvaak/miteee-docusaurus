<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL Number System decision map</title>
  <desc id="desc">A compact decision map for divisibility, HCF LCM, factors, unit digit, remainders, surds, indices, and decimal conversion.</desc>
  <rect width="1100" height="620" fill="#0f172a"/>
  <rect x="40" y="36" width="1020" height="548" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
  <text x="550" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Number System: Decision Map</text>
  <text x="550" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#bae6fd">Classify the number task, choose the matching rule, then verify the remainder or factor</text>

  <g font-family="Arial, sans-serif" font-size="18" fill="#f8fafc">
    <rect x="90" y="155" width="250" height="82" rx="12" fill="#164e63" stroke="#67e8f9"/>
    <text x="215" y="190" text-anchor="middle" font-weight="700">Divisibility</text>
      <text x="215" y="216" text-anchor="middle" font-size="14">Rules for 2, 3, 4, 5, 6, 8, 9, 11</text>

    <rect x="425" y="155" width="250" height="82" rx="12" fill="#14532d" stroke="#86efac"/>
    <text x="550" y="190" text-anchor="middle" font-weight="700">HCF / LCM</text>
    <text x="550" y="216" text-anchor="middle" font-size="14">Prime powers or Euclid</text>

    <rect x="760" y="155" width="250" height="82" rx="12" fill="#581c87" stroke="#d8b4fe"/>
    <text x="885" y="190" text-anchor="middle" font-weight="700">Unit Digit</text>
    <text x="885" y="216" text-anchor="middle" font-size="14">Cycle length 1, 2, or 4</text>

    <rect x="90" y="285" width="250" height="82" rx="12" fill="#7c2d12" stroke="#fdba74"/>
    <text x="215" y="320" text-anchor="middle" font-weight="700">Factors</text>
    <text x="215" y="346" text-anchor="middle" font-size="14">N = p^a q^b r^c</text>

    <rect x="425" y="285" width="250" height="82" rx="12" fill="#713f12" stroke="#fde68a"/>
    <text x="550" y="320" text-anchor="middle" font-weight="700">Remainders</text>
    <text x="550" y="346" text-anchor="middle" font-size="14">Reduce base, exponent, sign</text>

    <rect x="760" y="285" width="250" height="82" rx="12" fill="#831843" stroke="#f9a8d4"/>
    <text x="885" y="320" text-anchor="middle" font-weight="700">Surds / Indices</text>
    <text x="885" y="346" text-anchor="middle" font-size="14">Simplify, conjugate, compare</text>

    <rect x="255" y="430" width="250" height="82" rx="12" fill="#1e3a8a" stroke="#93c5fd"/>
    <text x="380" y="465" text-anchor="middle" font-weight="700">Decimals</text>
    <text x="380" y="491" text-anchor="middle" font-size="14">Terminating vs recurring</text>

    <rect x="595" y="430" width="250" height="82" rx="12" fill="#3f3f46" stroke="#d4d4d8"/>
    <text x="720" y="465" text-anchor="middle" font-weight="700">Option Testing</text>
    <text x="720" y="491" text-anchor="middle" font-size="14">Use when factor path is slow</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M340 196 H425"/>
    <path d="M675 196 H760"/>
    <path d="M215 237 V285"/>
    <path d="M550 237 V285"/>
    <path d="M885 237 V285"/>
    <path d="M340 367 L380 430"/>
    <path d="M675 367 L720 430"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
