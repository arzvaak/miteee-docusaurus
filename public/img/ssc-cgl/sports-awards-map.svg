<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL sports awards recall map</title>
  <desc id="desc">A quick recall map for SSC CGL sports, awards, honours, trophies, books, firsts, and event traps.</desc>
  <rect width="1200" height="760" fill="#08111f"/>
  <rect x="42" y="38" width="1116" height="684" rx="18" fill="#101c2b" stroke="#f8c14a" stroke-width="3"/>
  <text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fbff">Sports, Awards, Honours: 5-Second Recall Map</text>
  <text x="600" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#c5d4e8">353 promoted questions: classify entity, retrieve pair, avoid host-winner and first-person traps</text>

  <g font-family="Arial, sans-serif">
    <rect x="76" y="158" width="310" height="158" rx="14" fill="#162a3f" stroke="#60a5fa" stroke-width="2"/>
    <text x="231" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Trophy - Sport</text>
    <text x="102" y="225" font-size="17" fill="#e5f1ff">Ranji, Duleep: cricket</text>
    <text x="102" y="253" font-size="17" fill="#e5f1ff">Santosh, Durand: football</text>
    <text x="102" y="281" font-size="17" fill="#e5f1ff">Agha Khan, Azlan Shah: hockey</text>

    <rect x="445" y="158" width="310" height="158" rx="14" fill="#162a3f" stroke="#facc15" stroke-width="2"/>
    <text x="600" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Awards - Field</text>
    <text x="471" y="225" font-size="17" fill="#fff7d6">Khel Ratna: highest sports honour</text>
    <text x="471" y="253" font-size="17" fill="#fff7d6">Arjuna: performance</text>
    <text x="471" y="281" font-size="17" fill="#fff7d6">Dronacharya: coaching</text>

    <rect x="814" y="158" width="310" height="158" rx="14" fill="#162a3f" stroke="#34d399" stroke-width="2"/>
    <text x="969" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">First Indian Facts</text>
    <text x="840" y="225" font-size="17" fill="#dcfce7">Tagore: first Indian Nobel</text>
    <text x="840" y="253" font-size="17" fill="#dcfce7">Bindra: first individual Olympic gold</text>
    <text x="840" y="281" font-size="17" fill="#dcfce7">Rakesh Sharma: space</text>

    <rect x="76" y="366" width="310" height="158" rx="14" fill="#162a3f" stroke="#fb7185" stroke-width="2"/>
    <text x="231" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Book - Author</text>
    <text x="102" y="433" font-size="17" fill="#ffe4e6">Wings of Fire: A. P. J. Abdul Kalam</text>
    <text x="102" y="461" font-size="17" fill="#ffe4e6">God of Small Things: Arundhati Roy</text>
    <text x="102" y="489" font-size="17" fill="#ffe4e6">Playing It My Way: Sachin</text>

    <rect x="445" y="366" width="310" height="158" rx="14" fill="#162a3f" stroke="#c084fc" stroke-width="2"/>
    <text x="600" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Host / Winner Trap</text>
    <text x="471" y="433" font-size="17" fill="#f3e8ff">Hosted by != won by</text>
    <text x="471" y="461" font-size="17" fill="#f3e8ff">Venue != champion</text>
    <text x="471" y="489" font-size="17" fill="#f3e8ff">Year wording controls answer</text>

    <rect x="814" y="366" width="310" height="158" rx="14" fill="#162a3f" stroke="#fb923c" stroke-width="2"/>
    <text x="969" y="398" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Hierarchy</text>
    <text x="840" y="433" font-size="17" fill="#ffedd5">Bharat Ratna highest civilian</text>
    <text x="840" y="461" font-size="17" fill="#ffedd5">Padma: Vibhushan, Bhushan, Shri</text>
    <text x="840" y="489" font-size="17" fill="#ffedd5">Param Vir Chakra highest wartime gallantry</text>

    <rect x="198" y="596" width="804" height="66" rx="33" fill="#f8c14a"/>
    <text x="600" y="637" text-anchor="middle" font-size="22" font-weight="700" fill="#07111e">Exam loop: trophy/award/book/first/venue -> recall pair -> check wording -> move fast</text>
  </g>
</svg>
