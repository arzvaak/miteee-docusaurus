<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">SSC CGL Averages Mixtures Alligation decision map</title>
  <desc id="desc">A visual decision map for averages, weighted averages, replacements, average speed, mixtures, alligation, and repeated replacement.</desc>
  <rect width="1100" height="620" fill="#0f172a"/>
  <rect x="42" y="38" width="1016" height="544" rx="18" fill="#111827" stroke="#14b8a6" stroke-width="3"/>
  <text x="550" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#f0fdfa">Averages, Mixtures, Alligation: 36-second Map</text>
  <text x="550" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#99f6e4">Identify count, weight, distance/time, or concentration before calculating</text>

  <g font-family="Arial, sans-serif" fill="#f8fafc">
    <rect x="78" y="155" width="230" height="86" rx="12" fill="#134e4a" stroke="#5eead4"/>
    <text x="193" y="190" text-anchor="middle" font-size="20" font-weight="700">Simple Average</text>
    <text x="193" y="216" text-anchor="middle" font-size="14">sum/count, total = avg x n</text>

    <rect x="435" y="155" width="230" height="86" rx="12" fill="#14532d" stroke="#86efac"/>
    <text x="550" y="190" text-anchor="middle" font-size="20" font-weight="700">Weighted Average</text>
    <text x="550" y="216" text-anchor="middle" font-size="14">weights x values / weights</text>

    <rect x="792" y="155" width="230" height="86" rx="12" fill="#7c2d12" stroke="#fdba74"/>
    <text x="907" y="190" text-anchor="middle" font-size="20" font-weight="700">Replacement</text>
    <text x="907" y="216" text-anchor="middle" font-size="14">change in total / count</text>

    <rect x="78" y="305" width="230" height="86" rx="12" fill="#1e3a8a" stroke="#93c5fd"/>
    <text x="193" y="340" text-anchor="middle" font-size="20" font-weight="700">Average Speed</text>
    <text x="193" y="366" text-anchor="middle" font-size="14">equal distance vs equal time</text>

    <rect x="435" y="305" width="230" height="86" rx="12" fill="#581c87" stroke="#d8b4fe"/>
    <text x="550" y="340" text-anchor="middle" font-size="20" font-weight="700">Alligation</text>
    <text x="550" y="366" text-anchor="middle" font-size="14">cross difference ratio</text>

    <rect x="792" y="305" width="230" height="86" rx="12" fill="#831843" stroke="#f9a8d4"/>
    <text x="907" y="340" text-anchor="middle" font-size="20" font-weight="700">Mixture</text>
    <text x="907" y="366" text-anchor="middle" font-size="14">actual amount, not percent sum</text>

    <rect x="265" y="460" width="250" height="86" rx="12" fill="#713f12" stroke="#fde68a"/>
    <text x="390" y="495" text-anchor="middle" font-size="20" font-weight="700">Class Average</text>
    <text x="390" y="521" text-anchor="middle" font-size="14">old total plus net change</text>

    <rect x="585" y="460" width="250" height="86" rx="12" fill="#3f3f46" stroke="#d4d4d8"/>
    <text x="710" y="495" text-anchor="middle" font-size="20" font-weight="700">Repeated Replace</text>
    <text x="710" y="521" text-anchor="middle" font-size="14">remaining x (1 - removed/V)^n</text>
  </g>

  <g stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M308 198 H435"/>
    <path d="M665 198 H792"/>
    <path d="M193 241 V305"/>
    <path d="M550 241 V305"/>
    <path d="M907 241 V305"/>
    <path d="M308 391 L390 460"/>
    <path d="M665 391 L710 460"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
