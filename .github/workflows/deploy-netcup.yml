name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netcup-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy note.arzvak.com
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime data
        run: npm run build:content

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build
          npm run verify:ssc-render
          node scripts/standalone-assets.mjs

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$NETCUP_SSH_KEY" > ~/.ssh/netcup_deploy_key
          chmod 600 ~/.ssh/netcup_deploy_key
          cat > ~/.ssh/config <<'SSH_CONFIG'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
            ControlMaster auto
            ControlPath ~/.ssh/control-%C
            ControlPersist 30m
          SSH_CONFIG
          chmod 600 ~/.ssh/config
          ssh-keyscan -H "$NETCUP_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to Netcup
        env:
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_APP_DIR"
          connected=0
          for attempt in $(seq 1 10); do
            if ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" "mkdir -p '$NETCUP_APP_DIR'"; then
              connected=1
              break
            fi
            echo "Netcup SSH attempt $attempt/10 failed; retrying in 30 seconds." >&2
            sleep 30
          done
          test "$connected" = "1"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             stamp=\$(date +%Y%m%d%H%M%S)
             backup_dir=/root/note-arzvak-backups
             mkdir -p \"\$backup_dir\"
             if [ -d '$NETCUP_APP_DIR/.next' ]; then
               tar --exclude='.next/cache' -C '$NETCUP_APP_DIR' -czf \"\$backup_dir/note-arzvak-predeploy-\$stamp.tar.gz\" .next public docker-compose.next.yml
               chmod 600 \"\$backup_dir/note-arzvak-predeploy-\$stamp.tar.gz\"
             fi
             if [ -f /etc/nginx/conf.d/note.arzvak.com.conf ]; then
               install -m 600 /etc/nginx/conf.d/note.arzvak.com.conf \"\$backup_dir/note-nginx-predeploy-\$stamp.conf\"
             fi"
          rsync -az --delete \
            --exclude '.docusaurus/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude 'build/' \
            --exclude '.next/cache/' \
            --exclude 'node_modules/' \
            --exclude 'data/auth/' \
            --exclude 'data/deeptutor/' \
            --exclude 'data/ollama/' \
            --exclude 'data/current-affairs/' \
            -e "ssh -i ~/.ssh/netcup_deploy_key" \
            ./ "$NETCUP_USER@$NETCUP_HOST:$NETCUP_APP_DIR/"

      - name: Publish Next standalone app on Netcup
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          OPENCODE_GO_MODEL: deepseek-v4-flash
          DEEPTUTOR_EMBEDDING_MODEL: miteee-all-minilm
          DEEPTUTOR_EMBEDDING_DIMENSION: "384"
          DEEPTUTOR_ALLOWED_EMAILS: ${{ secrets.DEEPTUTOR_ALLOWED_EMAILS }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             chmod +x ops/netcup/publish-next-app.sh
             OPENCODE_GO_MODEL='$OPENCODE_GO_MODEL' DEEPTUTOR_EMBEDDING_MODEL='$DEEPTUTOR_EMBEDDING_MODEL' DEEPTUTOR_EMBEDDING_DIMENSION='$DEEPTUTOR_EMBEDDING_DIMENSION' DEEPTUTOR_ALLOWED_EMAILS='$DEEPTUTOR_ALLOWED_EMAILS' ops/netcup/publish-next-app.sh '$NETCUP_APP_DIR'"

      - name: Install SSC CGL news cron container
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-pro
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Kolkata date +%F)"
          echo "CURRENT_AFFAIRS_RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             chmod +x ops/netcup/install-ssc-cgl-news.sh
             DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY' DEEPSEEK_MODEL='$DEEPSEEK_MODEL' MISTRAL_API_KEY='$MISTRAL_API_KEY' MISTRAL_MODEL='$MISTRAL_MODEL' RUN_DATE='$RUN_DATE' ops/netcup/install-ssc-cgl-news.sh '$NETCUP_APP_DIR'"

      - name: Refresh Next app after current-affairs artifacts
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          DEEPTUTOR_ALLOWED_EMAILS: ${{ secrets.DEEPTUTOR_ALLOWED_EMAILS }}
          OPENCODE_GO_MODEL: deepseek-v4-flash
          DEEPTUTOR_EMBEDDING_MODEL: miteee-all-minilm
          DEEPTUTOR_EMBEDDING_DIMENSION: "384"
        run: |
          set -euo pipefail
          test -n "${CURRENT_AFFAIRS_RUN_DATE:-}"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             RUN_DATE='$CURRENT_AFFAIRS_RUN_DATE'
             test -s data/current-affairs/daily/\$RUN_DATE.json
             chmod -R a+rX data/current-affairs
             mkdir -p data/auth
             chown -R 1001:1001 data/auth
             chmod 700 data/auth
             export NEXT_APP_PUBLISHED_PORT=3025
             export BETTER_AUTH_URL=https://note.arzvak.com
             export DEEPTUTOR_ALLOWED_EMAILS='$DEEPTUTOR_ALLOWED_EMAILS'
             export OPENCODE_GO_MODEL='$OPENCODE_GO_MODEL'
             export DEEPTUTOR_EMBEDDING_MODEL='$DEEPTUTOR_EMBEDDING_MODEL'
             export DEEPTUTOR_EMBEDDING_DIMENSION='$DEEPTUTOR_EMBEDDING_DIMENSION'
             docker compose -f docker-compose.next.yml up -d --no-build
             docker compose -f docker-compose.next.yml --profile deeptutor-tools run --rm deeptutor-sync
             docker compose -f docker-compose.next.yml exec -T miteee-next sh -lc \"ls -lah /app/data/current-affairs/daily && test -s /app/data/current-affairs/daily/\$RUN_DATE.json\"
             for attempt in \$(seq 1 30); do
             if curl --fail --silent --show-error http://127.0.0.1:3025/exams/ssc-cgl/current-affairs | grep -q 'Daily depth, weekly clarity, monthly revision.' \
                 && curl --fail --silent --show-error http://127.0.0.1:3025/api/auth/get-session >/dev/null; then
                 exit 0
               fi
               sleep 2
             done
             docker compose -f docker-compose.next.yml ps || true
             docker compose -f docker-compose.next.yml logs --tail 80 miteee-next || true
             exit 1"

      - name: Verify deployed app
        env:
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             chmod +x ops/netcup/verify-next-app.sh
             ops/netcup/verify-next-app.sh http://127.0.0.1:3025"
