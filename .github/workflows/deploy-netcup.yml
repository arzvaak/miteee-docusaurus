name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netcup-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy note.arzvak.com
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build
          npm run verify:ssc-render
          node scripts/standalone-assets.mjs

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$NETCUP_SSH_KEY" > ~/.ssh/netcup_deploy_key
          chmod 600 ~/.ssh/netcup_deploy_key
          ssh-keyscan -H "$NETCUP_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to Netcup
        env:
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_APP_DIR"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" "mkdir -p '$NETCUP_APP_DIR'"
          rsync -az --delete \
            --exclude '.docusaurus/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude 'build/' \
            --exclude '.next/cache/' \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/netcup_deploy_key" \
            ./ "$NETCUP_USER@$NETCUP_HOST:$NETCUP_APP_DIR/"

      - name: Publish Next standalone app on Netcup
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             chmod +x ops/netcup/publish-next-app.sh
             ops/netcup/publish-next-app.sh '$NETCUP_APP_DIR'"

      - name: Install SSC CGL news cron container
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-pro
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             chmod +x ops/netcup/install-ssc-cgl-news.sh
             DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY' DEEPSEEK_MODEL='$DEEPSEEK_MODEL' MISTRAL_API_KEY='$MISTRAL_API_KEY' MISTRAL_MODEL='$MISTRAL_MODEL' RUN_DATE=\$(TZ=Asia/Kolkata date +%F) ops/netcup/install-ssc-cgl-news.sh '$NETCUP_APP_DIR'"

      - name: Refresh Next app after current-affairs artifacts
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             RUN_DATE=\$(TZ=Asia/Kolkata date +%F)
             test -s data/current-affairs/daily/\$RUN_DATE.json
             chmod -R a+rX data/current-affairs
             printf '%s\n' 'services:' '  miteee-next:' '    ports:' '      - \"3025:3000\"' > /tmp/miteee-next-netcup-ports.yml
             docker compose -f docker-compose.next.yml -f /tmp/miteee-next-netcup-ports.yml up -d --no-build --force-recreate
             docker cp data/current-affairs/. miteee-next-app:/app/data/current-affairs/
             docker compose -f docker-compose.next.yml -f /tmp/miteee-next-netcup-ports.yml restart miteee-next
             docker compose -f docker-compose.next.yml -f /tmp/miteee-next-netcup-ports.yml exec -T miteee-next sh -lc \"ls -lah /app/data/current-affairs/daily && test -s /app/data/current-affairs/daily/\$RUN_DATE.json\"
             for attempt in \$(seq 1 30); do
               if curl --fail --silent --show-error http://127.0.0.1:3025/exams/ssc-cgl/current-affairs | grep -q 'Recall queue'; then
                 exit 0
               fi
               sleep 2
             done
             docker compose -f docker-compose.next.yml -f /tmp/miteee-next-netcup-ports.yml ps || true
             docker compose -f docker-compose.next.yml -f /tmp/miteee-next-netcup-ports.yml logs --tail 80 miteee-next || true
             exit 1"

      - name: Verify public site
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://note.arzvak.com/ > /tmp/note-home.html
          grep -q "/exams/ssc-cgl" /tmp/note-home.html
          curl --fail --location --silent --show-error https://note.arzvak.com/exams/ssc-cgl > /tmp/ssc-cgl.html
          grep -q "SSC CGL" /tmp/ssc-cgl.html
          npx playwright install --with-deps chromium
          SSC_BROWSER_BASE_URL=https://note.arzvak.com npm run verify:ssc-browser
