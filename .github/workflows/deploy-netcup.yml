name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netcup-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy note.arzvak.com
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build
          npm run verify:ssc-render
          node scripts/standalone-assets.mjs

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$NETCUP_SSH_KEY" > ~/.ssh/netcup_deploy_key
          chmod 600 ~/.ssh/netcup_deploy_key
          ssh-keyscan -H "$NETCUP_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to Netcup
        env:
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_APP_DIR"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" "mkdir -p '$NETCUP_APP_DIR'"
          rsync -az --delete \
            --exclude '.docusaurus/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude 'build/' \
            --exclude '.next/cache/' \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/netcup_deploy_key" \
            ./ "$NETCUP_USER@$NETCUP_HOST:$NETCUP_APP_DIR/"

      - name: Publish Next standalone app on Netcup
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             test -n '$NETCUP_APP_DIR'
             mkdir -p /root/note-arzvak-backups
             if [ -d '$NETCUP_APP_DIR/.next/standalone' ]; then
               tar -C '$NETCUP_APP_DIR' -czf /root/note-arzvak-backups/note-arzvak-next-\$(date +%Y%m%d%H%M%S).tar.gz .next public data/current-affairs 2>/dev/null || true
             else
               mkdir -p '$NETCUP_APP_DIR'
             fi
             test -f '$NETCUP_APP_DIR/.next/standalone/server.js'
             if command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q '^note-arzvak-next\\.service'; then
               systemctl restart note-arzvak-next
             elif command -v pm2 >/dev/null 2>&1; then
               cd '$NETCUP_APP_DIR' && pm2 restart note-arzvak-next || pm2 start npm --name note-arzvak-next -- start -- --port 3025 --hostname 127.0.0.1
             else
               echo 'warning: no known note-arzvak-next process manager found; synced standalone app but did not restart service' >&2
             fi
             nginx -t
             nginx -s reload"

      - name: Install SSC CGL news cron container
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             chmod +x ops/netcup/install-ssc-cgl-news.sh
             MISTRAL_API_KEY='$MISTRAL_API_KEY' MISTRAL_MODEL='$MISTRAL_MODEL' RUN_DATE=\$(TZ=Asia/Kolkata date +%F) ops/netcup/install-ssc-cgl-news.sh '$NETCUP_APP_DIR'"

      - name: Verify public site
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://note.arzvak.com/ > /tmp/note-home.html
          grep -q "/exams/ssc-cgl" /tmp/note-home.html
          curl --fail --location --silent --show-error https://note.arzvak.com/exams/ssc-cgl > /tmp/ssc-cgl.html
          grep -q "SSC CGL" /tmp/ssc-cgl.html
          npx playwright install --with-deps chromium
          SSC_BROWSER_BASE_URL=https://note.arzvak.com npm run verify:ssc-browser
