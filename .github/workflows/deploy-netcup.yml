name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netcup-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy note.arzvak.com
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime data
        run: npm run build:content

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm run build
          npm run verify:ssc-render
          node scripts/standalone-assets.mjs

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$NETCUP_SSH_KEY" > ~/.ssh/netcup_deploy_key
          chmod 600 ~/.ssh/netcup_deploy_key
          cat > ~/.ssh/config <<'SSH_CONFIG'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            ConnectTimeout 30
          SSH_CONFIG
          chmod 600 ~/.ssh/config
          ssh-keyscan -H "$NETCUP_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to Netcup
        env:
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_APP_DIR"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" "mkdir -p '$NETCUP_APP_DIR'"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             stamp=\$(date +%Y%m%d%H%M%S)
             backup_dir=/root/note-arzvak-backups
             mkdir -p \"\$backup_dir\"
             if [ -d '$NETCUP_APP_DIR/.next' ]; then
               tar --exclude='.next/cache' -C '$NETCUP_APP_DIR' -czf \"\$backup_dir/note-arzvak-predeploy-\$stamp.tar.gz\" .next public docker-compose.next.yml
               chmod 600 \"\$backup_dir/note-arzvak-predeploy-\$stamp.tar.gz\"
             fi
             if [ -f /etc/nginx/conf.d/note.arzvak.com.conf ]; then
               install -m 600 /etc/nginx/conf.d/note.arzvak.com.conf \"\$backup_dir/note-nginx-predeploy-\$stamp.conf\"
             fi"
          rsync -az --delete \
            --exclude '.docusaurus/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude 'build/' \
            --exclude '.next/cache/' \
            --exclude 'node_modules/' \
            --exclude 'data/auth/' \
            --exclude 'data/deeptutor/' \
            --exclude 'data/current-affairs/' \
            -e "ssh -i ~/.ssh/netcup_deploy_key" \
            ./ "$NETCUP_USER@$NETCUP_HOST:$NETCUP_APP_DIR/"

      - name: Publish Next standalone app on Netcup
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
          MISTRAL_EMBEDDING_MODEL: mistral-embed
          DEEPTUTOR_ALLOWED_EMAILS: ${{ secrets.DEEPTUTOR_ALLOWED_EMAILS }}
          DEEPTUTOR_SSH_TARGET: ${{ secrets.NETCUP_USER }}@note.arzvak.com
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             chmod +x ops/netcup/publish-next-app.sh
             MISTRAL_API_KEY='$MISTRAL_API_KEY' MISTRAL_MODEL='$MISTRAL_MODEL' MISTRAL_EMBEDDING_MODEL='$MISTRAL_EMBEDDING_MODEL' DEEPTUTOR_ALLOWED_EMAILS='$DEEPTUTOR_ALLOWED_EMAILS' DEEPTUTOR_SSH_TARGET='$DEEPTUTOR_SSH_TARGET' ops/netcup/publish-next-app.sh '$NETCUP_APP_DIR'"

      - name: Install SSC CGL news cron container
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-pro
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
        run: |
          set -euo pipefail
          RUN_DATE="$(TZ=Asia/Kolkata date +%F)"
          echo "CURRENT_AFFAIRS_RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             chmod +x ops/netcup/install-ssc-cgl-news.sh
             DEEPSEEK_API_KEY='$DEEPSEEK_API_KEY' DEEPSEEK_MODEL='$DEEPSEEK_MODEL' MISTRAL_API_KEY='$MISTRAL_API_KEY' MISTRAL_MODEL='$MISTRAL_MODEL' RUN_DATE='$RUN_DATE' ops/netcup/install-ssc-cgl-news.sh '$NETCUP_APP_DIR'"

      - name: Refresh Next app after current-affairs artifacts
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          DEEPTUTOR_ALLOWED_EMAILS: ${{ secrets.DEEPTUTOR_ALLOWED_EMAILS }}
          DEEPTUTOR_SSH_TARGET: ${{ secrets.NETCUP_USER }}@note.arzvak.com
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
          MISTRAL_EMBEDDING_MODEL: mistral-embed
        run: |
          set -euo pipefail
          test -n "${CURRENT_AFFAIRS_RUN_DATE:-}"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             cd '$NETCUP_APP_DIR'
             RUN_DATE='$CURRENT_AFFAIRS_RUN_DATE'
             test -s data/current-affairs/daily/\$RUN_DATE.json
             chmod -R a+rX data/current-affairs
             mkdir -p data/auth
             chown -R 1001:1001 data/auth
             chmod 700 data/auth
             export NEXT_APP_PUBLISHED_PORT=3025
             export BETTER_AUTH_URL=https://note.arzvak.com
             export DEEPTUTOR_ALLOWED_EMAILS='$DEEPTUTOR_ALLOWED_EMAILS'
             export DEEPTUTOR_SSH_TARGET='$DEEPTUTOR_SSH_TARGET'
             export MISTRAL_API_KEY='$MISTRAL_API_KEY'
             export MISTRAL_MODEL='$MISTRAL_MODEL'
             export MISTRAL_EMBEDDING_MODEL='$MISTRAL_EMBEDDING_MODEL'
             docker compose -f docker-compose.next.yml up -d --no-build
             docker compose -f docker-compose.next.yml --profile deeptutor-tools run --rm deeptutor-sync
             docker compose -f docker-compose.next.yml exec -T miteee-next sh -lc \"ls -lah /app/data/current-affairs/daily && test -s /app/data/current-affairs/daily/\$RUN_DATE.json\"
             for attempt in \$(seq 1 30); do
             if curl --fail --silent --show-error http://127.0.0.1:3025/exams/ssc-cgl/current-affairs | grep -q 'Daily depth, weekly clarity, monthly revision.' \
                 && curl --fail --silent --show-error http://127.0.0.1:3025/api/auth/get-session >/dev/null; then
                 exit 0
               fi
               sleep 2
             done
             docker compose -f docker-compose.next.yml ps || true
             docker compose -f docker-compose.next.yml logs --tail 80 miteee-next || true
             exit 1"

      - name: Verify public site
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://note.arzvak.com/ > /tmp/note-home.html
          grep -q "Library spaces" /tmp/note-home.html
          grep -q "Choose what you want to learn" /tmp/note-home.html
          grep -q "/settings" /tmp/note-home.html
          redirect_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://note.arzvak.com/research/valorant-preliminary-findings)"
          test "$redirect_status" = "308"
          curl --fail --location --silent --show-error https://note.arzvak.com/notes/research-valorant-preliminary-findings-index > /tmp/valorant-research.html
          grep -q "Research note" /tmp/valorant-research.html
          grep -q "Pre match outcome prediction in professional VALORANT" /tmp/valorant-research.html
          grep -q "Work in progress" /tmp/valorant-research.html
          grep -q "not yet tested the final model on a completely untouched future tournament" /tmp/valorant-research.html
          curl --fail --location --silent --show-error https://note.arzvak.com/courses/RESEARCH > /tmp/research-notes.html
          grep -q "Research notes" /tmp/research-notes.html
          curl --fail --location --silent --show-error --output /dev/null https://note.arzvak.com/content-assets/research/valorant-preliminary-findings/assets/composition-map-feature-audit.png
          curl --fail --location --silent --show-error https://note.arzvak.com/settings > /tmp/study-settings.html
          grep -q "Make this study space yours" /tmp/study-settings.html
          grep -q "Reader layout" /tmp/study-settings.html
          curl --fail --location --silent --show-error https://note.arzvak.com/login > /tmp/login.html
          grep -q "Log in" /tmp/login.html
          grep -q 'noindex' /tmp/login.html
          curl --fail --location --silent --show-error https://note.arzvak.com/register > /tmp/register.html
          grep -q "Create account" /tmp/register.html
          grep -q 'noindex' /tmp/register.html
          auth_status="$(curl --location --silent --show-error --output /tmp/auth-probe.json --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://note.arzvak.com' \
            --header 'Content-Type: application/json' \
            --data '{"email":"deployment-auth-probe@invalid.example","password":"deliberately-wrong-password"}' \
            https://note.arzvak.com/api/auth/sign-in/email)"
          test "$auth_status" = "401"
          tutor_status="$(curl --silent --show-error --output /tmp/deeptutor-probe.json --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"message":"private route probe"}' \
            https://note.arzvak.com/api/deeptutor)"
          test "$tutor_status" = "404"
          curl --fail --location --silent --show-error https://note.arzvak.com/exams/ssc-cgl > /tmp/ssc-cgl.html
          grep -q "Build each subject. Then test it." /tmp/ssc-cgl.html
          grep -q "Four sections, clearly separated." /tmp/ssc-cgl.html
          if grep -q "Study Vault" /tmp/ssc-cgl.html; then
            echo "Legacy Study Vault label is still present on the SSC CGL landing page" >&2
            exit 1
          fi
          npx playwright install --with-deps chromium
          SSC_BROWSER_BASE_URL=https://note.arzvak.com npm run verify:ssc-browser
