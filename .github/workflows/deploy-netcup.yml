name: Deploy to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netcup-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy note.arzvak.com
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$NETCUP_SSH_KEY" > ~/.ssh/netcup_deploy_key
          chmod 600 ~/.ssh/netcup_deploy_key
          ssh-keyscan -H "$NETCUP_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to Netcup
        env:
          NETCUP_APP_DIR: ${{ secrets.NETCUP_APP_DIR }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
        run: |
          set -euo pipefail
          test -n "$NETCUP_APP_DIR"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" "mkdir -p '$NETCUP_APP_DIR'"
          rsync -az --delete \
            --exclude '.docusaurus/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git/' \
            --exclude 'build/' \
            --exclude 'node_modules/' \
            -e "ssh -i ~/.ssh/netcup_deploy_key" \
            ./ "$NETCUP_USER@$NETCUP_HOST:$NETCUP_APP_DIR/"

      - name: Publish build to Netcup
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_USER: ${{ secrets.NETCUP_USER }}
          NETCUP_WEBROOT: ${{ secrets.NETCUP_WEBROOT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             test -n '$NETCUP_WEBROOT'
             mkdir -p /root/note-arzvak-backups
             if [ -d '$NETCUP_WEBROOT' ]; then
               tar -C '$NETCUP_WEBROOT' -czf /root/note-arzvak-backups/note-arzvak-\$(date +%Y%m%d%H%M%S).tar.gz .
             else
               mkdir -p '$NETCUP_WEBROOT'
             fi
             mkdir -p '$NETCUP_WEBROOT'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/netcup_deploy_key" \
            build/ "$NETCUP_USER@$NETCUP_HOST:$NETCUP_WEBROOT/"
          ssh -i ~/.ssh/netcup_deploy_key "$NETCUP_USER@$NETCUP_HOST" \
            "set -euo pipefail
             nginx -t
             nginx -s reload"

      - name: Verify public site
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://note.arzvak.com/ > /tmp/note-home.html
          grep -q "MIT EEE" /tmp/note-home.html
