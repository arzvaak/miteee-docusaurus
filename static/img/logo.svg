<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Circuit board / EEE icon -->
  <rect width="48" height="48" rx="10" fill="#6200ea"/>
  <!-- Chip body -->
  <rect x="14" y="14" width="20" height="20" rx="3" fill="white" opacity="0.15" stroke="white" stroke-width="1.5"/>
  <!-- Pins left -->
  <line x1="8" y1="19" x2="14" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="24" x2="14" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="29" x2="14" y2="29" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins right -->
  <line x1="34" y1="19" x2="40" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="24" x2="40" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="29" x2="40" y2="29" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Inner circuit cross -->
  <line x1="19" y1="24" x2="29" y2="24" stroke="white" stroke-width="1.5"/>
  <line x1="24" y1="19" x2="24" y2="29" stroke="white" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="2.5" fill="white"/>
</svg>
